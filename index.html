<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Endless VR Limbo - Sudden Death Survival</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
      body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
      
      /* UI Start Menu */
      #start-menu {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        font-family: monospace;
        color: #fff;
      }
      #start-btn {
        background: #440000;
        color: white;
        border: 2px solid #ff0000;
        padding: 15px 40px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        transition: 0.3s;
      }
      #start-btn:hover { background: #ff0000; color: #000; }

      /* Layar Sudden Death (Efek Darah) */
      #death-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999;
        pointer-events: none;
        /* Kombinasi radial gradient untuk efek bercak darah dan vignette gelap */
        background: 
          radial-gradient(circle at 30% 40%, #600000 0%, transparent 15%),
          radial-gradient(circle at 70% 60%, #800000 0%, transparent 20%),
          radial-gradient(circle at 50% 80%, #500000 0%, transparent 10%),
          radial-gradient(circle, transparent 20%, rgba(60, 0, 0, 0.8) 70%, #0a0000 100%);
        background-color: rgba(20, 0, 0, 0.6);
        animation: fadeInBlood 0.5s ease-out forwards;
      }
      
      @keyframes fadeInBlood {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      #death-text {
        position: absolute;
        top: 50%; width: 100%;
        transform: translateY(-50%);
        text-align: center;
        color: #ff0000;
        font-family: 'Courier New', Courier, monospace;
        font-size: 10vw;
        font-weight: bold;
        margin: 0;
        text-shadow: 2px 2px 10px #000, 0 0 20px #880000;
      }
    </style>

    <script>
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      
      // -- SISTEM AUDIO SINTESIS -- //
      
      // BGM Ambience
      function playBGM() {
        const bufferSize = audioCtx.sampleRate * 2; 
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400; 

        const whisperGain = audioCtx.createGain();
        whisperGain.gain.value = 0.2; 

        whiteNoise.connect(filter);
        filter.connect(whisperGain);
        whisperGain.connect(audioCtx.destination);
        whiteNoise.start(); 
      }

      // Suara Lengkingan (Screech) yang volumenya tergantung jarak
      function playScreech(volumeMult) {
        if (audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sawtooth';
        // Nada melengking sumbang
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(2500, audioCtx.currentTime + 0.3);
        osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.6);
        
        // Volume diatur oleh seberapa dekat musuh
        let finalVol = Math.max(0.01, volumeMult * 3); 
        
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(finalVol, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); 
        osc.stop(audioCtx.currentTime + 1);
      }

      // Suara Kematian (Death Crunch/Bass Drop)
      function playDeathSound() {
        if (audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
        
        gain.gain.setValueAtTime(4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); 
        osc.stop(audioCtx.currentTime + 2);
      }


      // -- SISTEM KONTROL & GAMEPLAY -- //
      
      // Tap to Move (Sekarang bisa dimatikan saat mati)
      AFRAME.registerComponent('tap-to-move', {
        init: function () {
          this.rig = document.querySelector('#cameraRig');
          this.el.addEventListener('click', (evt) => {
            if (window.isGameOver) return; // Kunci pergerakan jika mati
            
            var point = evt.detail.intersection.point;
            this.rig.setAttribute('animation', {
              property: 'position',
              to: point.x + ' 0 ' + point.z,
              dur: 1000, // Dipercepat sedikit agar bisa lari dari monster
              easing: 'linear'
            });
          });
        }
      });

      // Lantai Endless
      AFRAME.registerComponent('endless-ground', {
        tick: function () {
          var camPos = document.querySelector('#cameraRig').object3D.position;
          this.el.object3D.position.set(camPos.x, 0, camPos.z);
        }
      });

      // Hutan Endless
      AFRAME.registerComponent('endless-forest', {
        schema: { treeCount: {type: 'int', default: 200}, radius: {type: 'number', default: 50} },
        init: function () {
          this.trees = [];
          this.cameraRig = document.querySelector('#cameraRig');
          for (let i = 0; i < this.data.treeCount; i++) {
            let tree = document.createElement('a-cylinder');
            tree.setAttribute('color', '#020505');
            tree.setAttribute('material', 'shader: flat; roughness: 1');
            let radius = Math.random() * 0.4 + 0.1;
            let height = Math.random() * 20 + 10;
            tree.setAttribute('radius', radius);
            tree.setAttribute('height', height);
            this.repositionTree(tree, true);
            this.el.appendChild(tree);
            this.trees.push({el: tree, height: height});
          }
        },
        tick: function () {
          let camPos = this.cameraRig.object3D.position;
          for (let treeObj of this.trees) {
            let treePos = treeObj.el.object3D.position;
            let dx = treePos.x - camPos.x;
            let dz = treePos.z - camPos.z;
            if (Math.sqrt(dx*dx + dz*dz) > this.data.radius) {
              this.repositionTree(treeObj.el, false);
            }
          }
        },
        repositionTree: function (tree, isInit) {
          let camPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = isInit ? Math.random() * this.data.radius : this.data.radius - 2;
          if (isInit && dist < 4) dist += 5;
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          tree.object3D.position.set(tx, tree.getAttribute('height') / 2, tz);
        }
      });

      // -- SISTEM SUDDEN DEATH (MUSUH PENGEJAR) -- //
      window.isGameOver = false;

      AFRAME.registerComponent('threat-system', {
        init: function () {
          this.cameraRig = document.querySelector('#cameraRig');
          this.active = false;
          this.speed = 4.5; // Kecepatan musuh (Pemain berlari ~10 unit per detik jika spam klik)
          this.screechTimer = 0;
          this.threatPos = new THREE.Vector3();
        },
        startGame: function () {
          this.active = true;
          window.isGameOver = false;
          
          // Spawn musuh di radius 30 meter
          let rigPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = 30;
          
          this.threatPos.set(
            rigPos.x + Math.cos(angle) * dist,
            1.5, // Ketinggian melayang
            rigPos.z + Math.sin(angle) * dist
          );
          
          this.el.object3D.position.copy(this.threatPos);
          this.el.setAttribute('visible', 'true');
        },
        triggerDeath: function () {
          window.isGameOver = true;
          this.active = false;
          
          // Hentikan pergerakan kamera jika sedang jalan
          this.cameraRig.removeAttribute('animation');
          
          // Tampilkan overlay darah
          document.getElementById('death-overlay').style.display = 'block';
          
          playDeathSound();
        },
        tick: function (time, timeDelta) {
          if (!this.active || window.isGameOver) return;

          let rigPos = this.cameraRig.object3D.position;
          let distToPlayer = this.threatPos.distanceTo(rigPos);

          // Cek Jarak Kematian
          if (distToPlayer < 2.5) {
            this.triggerDeath();
            return;
          }

          // Pergerakan Mengejar Pemain
          let dir = new THREE.Vector3().subVectors(rigPos, this.threatPos).normalize();
          // Pertahankan ketinggian Y
          dir.y = 0; 
          
          let moveDist = this.speed * (timeDelta / 1000);
          this.threatPos.addScaledVector(dir, moveDist);
          this.el.object3D.position.copy(this.threatPos);
          this.el.object3D.lookAt(rigPos); // Menghadap pemain

          // Timer Suara Lengkingan (Setiap 2 - 3 detik)
          this.screechTimer -= timeDelta;
          if (this.screechTimer <= 0) {
            // Volume dikalkulasi berdasarkan jarak (Maks radius 40m)
            let vol = Math.max(0, 1.0 - (distToPlayer / 40));
            playScreech(vol);
            
            this.screechTimer = 2000 + (Math.random() * 1000);
          }
        }
      });

      // UI Init
      document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        const startMenu = document.getElementById('start-menu');
        const threatSystem = document.querySelector('#threatEntity').components['threat-system'];

        startBtn.addEventListener('click', () => {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          
          // Unlock Audio Playback
          const buffer = audioCtx.createBuffer(1, 1, 22050);
          const source = audioCtx.createBufferSource();
          source.buffer = buffer; source.connect(audioCtx.destination);
          if (source.start) source.start(0); else source.noteOn(0);

          playBGM();
          
          startMenu.style.display = 'none';
          
          // Beri jeda 3 detik sebelum musuh mulai mengejar
          setTimeout(() => {
            threatSystem.startGame();
          }, 3000);
        });
      });
    </script>
  </head>
  <body>
    
    <!-- UI Menu Awal -->
    <div id="start-menu">
      <h1 style="color: #ff0000; text-shadow: 0 0 10px red;">SURVIVE THE LIMBO</h1>
      <p>Tap the floor to run. Move AWAY from the screeching sound.</p>
      <button id="start-btn">ENTER SURVIVAL</button>
    </div>

    <!-- UI Overlay Darah Kematian -->
    <div id="death-overlay">
      <h1 id="death-text">YOU DIED</h1>
    </div>

    <!-- Warna fog Teal Gelap -->
    <a-scene fog="type: exponential; color: #071313; density: 0.065" background="color: #071313">

      <a-entity id="cameraRig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          
          <!-- Cursor Interaksi -->
          <a-entity cursor="rayOrigin: mouse;"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #ffffff; shader: flat; opacity: 0.4">
          </a-entity>
          
        </a-camera>
      </a-entity>

      <!-- ENTITAS MUSUH (SUDDEN DEATH TRIGGER) -->
      <!-- Menggunakan komponen threat-system -->
      <a-entity id="threatEntity" visible="false" threat-system>
        <!-- Inti merah berdenyut (Mata/Core) -->
        <a-sphere radius="0.3" position="0 1.5 0" color="#ff0000" material="shader: flat; transparent: true; opacity: 0.8" 
                  animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; dur: 500; loop: true"></a-sphere>
        <!-- Asap/Badan Hitam Pembungkus -->
        <a-sphere radius="1.2" position="0 1.2 0" color="#000000" material="shader: flat; transparent: true; opacity: 0.95"></a-sphere>
        <a-sphere radius="1.5" position="0.2 0.8 -0.2" color="#050505" material="shader: flat; transparent: true; opacity: 0.6"></a-sphere>
        <!-- Lengan Hitam Menjulur -->
        <a-box width="3" height="0.1" depth="0.5" position="0 1.2 0.5" color="#000000" material="shader: flat; transparent: true; opacity: 0.9"></a-box>
      </a-entity>

      <!-- Pencahayaan Lingkungan -->
      <a-light type="ambient" color="#1a2525"></a-light>
      <a-light type="point" color="#88cccc" intensity="0.4" position="0 15 0" distance="50"></a-light>

      <!-- Area Walkable -->
      <a-plane class="walkable" tap-to-move endless-ground rotation="-90 0 0" width="200" height="200" color="#030808" material="shader: flat"></a-plane>
      
      <!-- Hutan Halangan Generatif -->
      <a-entity endless-forest="treeCount: 200; radius: 50"></a-entity>

    </a-scene>
  </body>
</html>
