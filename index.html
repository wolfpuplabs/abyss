<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Endless VR Limbo - Mobile Optimized</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
      #ui-container {
        position: absolute;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
      }
      #scareToggle {
        background: rgba(10, 10, 10, 0.8);
        border: 2px solid #555;
        border-radius: 50%;
        width: 55px;
        height: 55px;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }
      #scareToggle.active {
        border-color: #ff0000;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        background: rgba(40, 0, 0, 0.8);
      }
    </style>

    <script>
      AFRAME.registerComponent('tap-to-move', {
        init: function () {
          var rig = document.querySelector('#cameraRig');
          this.el.addEventListener('click', function (evt) {
            var point = evt.detail.intersection.point;
            rig.setAttribute('animation', {
              property: 'position',
              to: point.x + ' 0 ' + point.z,
              dur: 1500,
              easing: 'easeOutCubic'
            });
          });
        }
      });

      AFRAME.registerComponent('endless-ground', {
        tick: function () {
          var camPos = document.querySelector('#cameraRig').object3D.position;
          this.el.object3D.position.set(camPos.x, 0, camPos.z);
        }
      });

      AFRAME.registerComponent('endless-forest', {
        schema: { treeCount: {type: 'int', default: 250}, radius: {type: 'number', default: 50} },
        init: function () {
          this.trees = [];
          this.cameraRig = document.querySelector('#cameraRig');
          for (let i = 0; i < this.data.treeCount; i++) {
            let tree = document.createElement('a-cylinder');
            // Pohon tetap hitam pekat untuk kontras siluet
            tree.setAttribute('color', '#000000');
            tree.setAttribute('material', 'shader: flat; roughness: 1');
            let radius = Math.random() * 0.5 + 0.1;
            let height = Math.random() * 20 + 10;
            tree.setAttribute('radius', radius);
            tree.setAttribute('height', height);
            this.repositionTree(tree, true);
            this.el.appendChild(tree);
            this.trees.push({el: tree, height: height});
          }
        },
        tick: function () {
          let camPos = this.cameraRig.object3D.position;
          for (let treeObj of this.trees) {
            let treePos = treeObj.el.object3D.position;
            let dx = treePos.x - camPos.x;
            let dz = treePos.z - camPos.z;
            if (Math.sqrt(dx*dx + dz*dz) > this.data.radius) {
              this.repositionTree(treeObj.el, false);
            }
          }
        },
        repositionTree: function (tree, isInit) {
          let camPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = isInit ? Math.random() * this.data.radius : this.data.radius - 2;
          if (isInit && dist < 4) dist += 5;
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          tree.object3D.position.set(tx, tree.getAttribute('height') / 2, tz);
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('scareToggle');
        const scareFace = document.getElementById('scareFace');
        
        let scareActive = true; 
        let scareTimer = null;
        
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        document.body.addEventListener('click', () => {
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        }, { once: true });

        function playScareSound() {
          if (audioCtx.state === 'suspended') return; 
          
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
          gainNode.gain.setValueAtTime(2, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.5);
        }

        function triggerScare() {
          if (!scareActive) return;
          scareFace.setAttribute('visible', 'true');
          playScareSound();
          
          setTimeout(() => {
            scareFace.setAttribute('visible', 'false');
            scheduleNextScare();
          }, 350); 
        }

        function scheduleNextScare() {
          if (!scareActive) return;
          const nextScareTime = Math.random() * 17000 + 8000; 
          scareTimer = setTimeout(triggerScare, nextScareTime);
        }

        scheduleNextScare();

        toggleBtn.addEventListener('click', () => {
          scareActive = !scareActive;
          if (scareActive) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            toggleBtn.classList.add('active');
            toggleBtn.innerHTML = '👁️'; 
            scheduleNextScare();
          } else {
            toggleBtn.classList.remove('active');
            toggleBtn.innerHTML = '🔕'; 
            clearTimeout(scareTimer);
            scareFace.setAttribute('visible', 'false');
          }
        });
      });
    </script>
  </head>
  <body>
    
    <div id="ui-container">
      <button id="scareToggle" class="active" title="Toggle Scare">👁️</button>
    </div>

    <!-- Peningkatan visibilitas: Warna background dan fog dinaikkan menjadi #1e1e1e (abu-abu gelap) -->
    <!-- Density sedikit diturunkan menjadi 0.06 agar pandangan lebih luas -->
    <a-scene fog="type: exponential; color: #1e1e1e; density: 0.06" background="color: #1e1e1e">

      <a-assets>
        <img id="ghostImg" src="image_2.png">
      </a-assets>

      <a-entity id="cameraRig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          
          <!-- Cursor diperterang sedikit agar lebih mudah dilihat -->
          <a-entity cursor="rayOrigin: mouse;"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #ffffff; shader: flat; opacity: 0.8">
          </a-entity>
          
          <a-image id="scareFace" 
                   src="#ghostImg" 
                   position="0 -0.2 -0.8" 
                   width="1.2" 
                   height="2" 
                   material="shader: flat; transparent: true; opacity: 0.85; color: #d0d0d0"
                   visible="false">
          </a-image>

        </a-camera>
      </a-entity>

      <!-- Ambient Light dinaikkan menjadi #333 agar lantai lebih terlihat -->
      <a-light type="ambient" color="#333"></a-light>
      <a-light type="point" color="#ffffff" intensity="0.6" position="0 15 0" distance="50"></a-light>

      <!-- Warna lantai dinaikkan menjadi #1a1a1a agar tidak menyatu total dengan fog -->
      <a-plane class="walkable" tap-to-move endless-ground rotation="-90 0 0" width="200" height="200" color="#1a1a1a" material="shader: flat"></a-plane>
      
      <a-entity endless-forest="treeCount: 250; radius: 50"></a-entity>

    </a-scene>
  </body>
</html>
