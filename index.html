<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Endless VR Limbo - Sudden Death Survival</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
      body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
      
      /* UI Start Menu */
      #start-menu {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        font-family: monospace;
        color: #fff;
      }
      .btn {
        background: #440000;
        color: white;
        border: 2px solid #ff0000;
        padding: 15px 40px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        transition: 0.3s;
      }
      .btn:hover { background: #ff0000; color: #000; }

      /* Timer In-Game */
      #hud-timer {
        display: none;
        position: absolute;
        top: 20px; left: 50%;
        transform: translateX(-50%);
        color: #fff;
        font-family: monospace;
        font-size: 24px;
        z-index: 9998;
        text-shadow: 2px 2px 5px #000, 0 0 10px #ff0000;
      }

      /* Layar Sudden Death */
      #death-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: 
          radial-gradient(circle at 30% 40%, #600000 0%, transparent 15%),
          radial-gradient(circle at 70% 60%, #800000 0%, transparent 20%),
          radial-gradient(circle at 50% 80%, #500000 0%, transparent 10%),
          radial-gradient(circle, transparent 20%, rgba(60, 0, 0, 0.8) 70%, #0a0000 100%);
        background-color: rgba(20, 0, 0, 0.6);
        animation: fadeInBlood 0.5s ease-out forwards;
      }
      
      @keyframes fadeInBlood {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      #death-text {
        color: #ff0000;
        font-family: 'Courier New', Courier, monospace;
        font-size: 10vw;
        font-weight: bold;
        margin: 0;
        text-shadow: 2px 2px 10px #000, 0 0 30px #880000;
      }

      #final-time {
        color: #fff;
        font-family: monospace;
        font-size: 2vw;
        margin-top: 10px;
        margin-bottom: 40px;
        text-shadow: 2px 2px 5px #000;
      }
    </style>

    <script>
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      
      // BGM Ambience
      function playBGM() {
        const bufferSize = audioCtx.sampleRate * 2; 
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400; 

        const whisperGain = audioCtx.createGain();
        whisperGain.gain.value = 0.2; 

        whiteNoise.connect(filter);
        filter.connect(whisperGain);
        whisperGain.connect(audioCtx.destination);
        whiteNoise.start(); 
      }

      // Suara Lengkingan
      function playScreech(volumeMult) {
        if (audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(2500, audioCtx.currentTime + 0.3);
        osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.6);
        
        let finalVol = Math.max(0.01, volumeMult * 4); 
        
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(finalVol, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); 
        osc.stop(audioCtx.currentTime + 1);
      }

      // Suara Kematian
      function playDeathSound() {
        if (audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
        
        gain.gain.setValueAtTime(4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); 
        osc.stop(audioCtx.currentTime + 2);
      }


      // -- SISTEM KONTROL & GAMEPLAY -- //
      window.isGameOver = false;
      window.gameStartTime = 0;
      window.timerInterval = null;

      AFRAME.registerComponent('tap-to-move', {
        init: function () {
          this.rig = document.querySelector('#cameraRig');
          this.el.addEventListener('click', (evt) => {
            if (window.isGameOver) return; 
            
            var point = evt.detail.intersection.point;
            this.rig.setAttribute('animation', {
              property: 'position',
              to: point.x + ' 0 ' + point.z,
              dur: 1000, 
              easing: 'linear'
            });
          });
        }
      });

      AFRAME.registerComponent('endless-ground', {
        tick: function () {
          var camPos = document.querySelector('#cameraRig').object3D.position;
          this.el.object3D.position.set(camPos.x, 0, camPos.z);
        }
      });

      AFRAME.registerComponent('endless-forest', {
        schema: { treeCount: {type: 'int', default: 200}, radius: {type: 'number', default: 50} },
        init: function () {
          this.trees = [];
          this.cameraRig = document.querySelector('#cameraRig');
          for (let i = 0; i < this.data.treeCount; i++) {
            let tree = document.createElement('a-cylinder');
            tree.setAttribute('color', '#020505');
            tree.setAttribute('material', 'shader: flat; roughness: 1');
            let radius = Math.random() * 0.4 + 0.1;
            let height = Math.random() * 20 + 10;
            tree.setAttribute('radius', radius);
            tree.setAttribute('height', height);
            this.repositionTree(tree, true);
            this.el.appendChild(tree);
            this.trees.push({el: tree, height: height});
          }
        },
        tick: function () {
          let camPos = this.cameraRig.object3D.position;
          for (let treeObj of this.trees) {
            let treePos = treeObj.el.object3D.position;
            let dx = treePos.x - camPos.x;
            let dz = treePos.z - camPos.z;
            if (Math.sqrt(dx*dx + dz*dz) > this.data.radius) {
              this.repositionTree(treeObj.el, false);
            }
          }
        },
        repositionTree: function (tree, isInit) {
          let camPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = isInit ? Math.random() * this.data.radius : this.data.radius - 2;
          if (isInit && dist < 4) dist += 5;
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          tree.object3D.position.set(tx, tree.getAttribute('height') / 2, tz);
        }
      });

      // -- SISTEM SUDDEN DEATH (SKULL ENEMY) -- //
      AFRAME.registerComponent('threat-system', {
        init: function () {
          this.cameraRig = document.querySelector('#cameraRig');
          this.active = false;
          this.speed = 5.0; 
          this.screechTimer = 0;
          this.threatPos = new THREE.Vector3();
        },
        startGame: function () {
          this.active = true;
          window.isGameOver = false;
          
          // Memulai Timer
          window.gameStartTime = Date.now();
          document.getElementById('hud-timer').style.display = 'block';
          if(window.timerInterval) clearInterval(window.timerInterval);
          window.timerInterval = setInterval(() => {
            if(!window.isGameOver) {
              let elapsed = (Date.now() - window.gameStartTime) / 1000;
              document.getElementById('timer-val').innerText = elapsed.toFixed(1);
            }
          }, 100);

          // Spawn musuh (jarak 20 meter, posisi acak melingkar)
          let rigPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = 20;
          
          this.threatPos.set(
            rigPos.x + Math.cos(angle) * dist,
            1.6, // Setinggi mata
            rigPos.z + Math.sin(angle) * dist
          );
          
          this.el.object3D.position.copy(this.threatPos);
          this.el.setAttribute('visible', 'true');
        },
        triggerDeath: function () {
          window.isGameOver = true;
          this.active = false;
          clearInterval(window.timerInterval);
          
          // Letakkan tengkorak di depan muka (Jump scare mati)
          let rigPos = this.cameraRig.object3D.position;
          this.el.object3D.position.set(rigPos.x, rigPos.y + 1.5, rigPos.z - 1.2);
          
          this.cameraRig.removeAttribute('animation');
          
          // Tampilkan layer kematian
          let elapsed = (Date.now() - window.gameStartTime) / 1000;
          document.getElementById('final-time-val').innerText = elapsed.toFixed(1);
          document.getElementById('death-overlay').style.display = 'flex';
          
          playDeathSound();
        },
        tick: function (time, timeDelta) {
          if (!this.active || window.isGameOver) return;

          let rigPos = this.cameraRig.object3D.position;
          let distToPlayer = this.threatPos.distanceTo(rigPos);

          if (distToPlayer < 3.5) {
            this.triggerDeath();
            return;
          }

          let dir = new THREE.Vector3().subVectors(rigPos, this.threatPos).normalize();
          dir.y = 0; 
          
          let moveDist = this.speed * (timeDelta / 1000);
          this.threatPos.addScaledVector(dir, moveDist);
          this.el.object3D.position.copy(this.threatPos);
          
          // Tengkorak selalu menatap ke arah player (Wajah ada di posisi Z-Positif lokal)
          this.el.object3D.lookAt(rigPos); 

          this.screechTimer -= timeDelta;
          if (this.screechTimer <= 0) {
            let vol = Math.max(0, 1.0 - (distToPlayer / 30));
            playScreech(vol);
            this.screechTimer = 1000 + (Math.random() * 1000);
          }
        }
      });

      // INISIALISASI UI
      document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        const startMenu = document.getElementById('start-menu');
        const restartBtn = document.getElementById('restart-btn');
        let bgmStarted = false;

        function initAudioAndStart() {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          
          if(!bgmStarted) {
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer; source.connect(audioCtx.destination);
            if (source.start) source.start(0); else source.noteOn(0);
            playBGM();
            bgmStarted = true;
          }
          
          // Mulai sistem musuh & timer
          setTimeout(() => {
            const threatEntity = document.querySelector('#threatEntity');
            if (threatEntity && threatEntity.components['threat-system']) {
              threatEntity.components['threat-system'].startGame();
            }
          }, 1000);
        }

        // Tombol Start Menu
        startBtn.addEventListener('click', () => {
          startMenu.style.display = 'none';
          initAudioAndStart();
        });

        // Tombol Play Again
        restartBtn.addEventListener('click', () => {
          document.getElementById('death-overlay').style.display = 'none';
          document.getElementById('timer-val').innerText = "0.0";
          
          // Reset posisi player ke origin
          const camRig = document.querySelector('#cameraRig');
          camRig.removeAttribute('animation');
          camRig.object3D.position.set(0, 0, 0);
          
          initAudioAndStart();
        });
      });
    </script>
  </head>
  <body>
    
    <!-- UI Menu Awal -->
    <div id="start-menu">
      <h1 style="color: #ff0000; text-shadow: 0 0 10px red;">SURVIVE THE LIMBO</h1>
      <p>Tap the floor to run. Move AWAY from the screeching sound.</p>
      <button class="btn" id="start-btn">ENTER SURVIVAL</button>
    </div>

    <!-- HUD Timer saat Game Berjalan -->
    <div id="hud-timer">Time: <span id="timer-val">0.0</span>s</div>

    <!-- UI Overlay Darah Kematian -->
    <div id="death-overlay">
      <h1 id="death-text">YOU DIED</h1>
      <p id="final-time">You survived for: <span id="final-time-val" style="color: #ff0000; font-weight: bold;">0.0</span>s</p>
      <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>

    <a-scene fog="type: exponential; color: #071313; density: 0.065" background="color: #071313">

      <a-entity id="cameraRig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          
          <a-entity cursor="rayOrigin: mouse;"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #ffffff; shader: flat; opacity: 0.4">
          </a-entity>
          
        </a-camera>
      </a-entity>

      <!-- ENTITAS MUSUH PENGEJAR: 3D Low Poly Red Skull -->
      <a-entity id="threatEntity" visible="false" threat-system>
        
        <!-- Wrapper animasi agar tengkorak terlihat "melayang/floating" naik-turun -->
        <a-entity animation="property: position; to: 0 0.3 0; dir: alternate; dur: 1200; loop: true; easing: easeInOutSine">
          
          <!-- Cranium (Tulang Kepala Atas) -->
          <a-icosahedron radius="0.6" color="#ff0000" material="flatShading: true; roughness: 1; emissive: #330000; emissiveIntensity: 0.5"></a-icosahedron>
          
          <!-- Tulang Pipi / Rahang Atas -->
          <a-box width="0.75" height="0.4" depth="0.5" position="0 -0.4 0.2" color="#dd0000" material="flatShading: true; roughness: 1; emissive: #220000"></a-box>
          
          <!-- Rahang Bawah -->
          <a-box width="0.5" height="0.3" depth="0.4" position="0 -0.7 0.25" color="#aa0000" material="flatShading: true; roughness: 1"></a-box>
          
          <!-- Soket Mata Kiri -->
          <a-icosahedron radius="0.18" position="-0.25 -0.1 0.52" color="#000" material="flatShading: true"></a-icosahedron>
          
          <!-- Soket Mata Kanan -->
          <a-icosahedron radius="0.18" position="0.25 -0.1 0.52" color="#000" material="flatShading: true"></a-icosahedron>
          
          <!-- Rongga Hidung -->
          <a-tetrahedron radius="0.12" position="0 -0.35 0.55" rotation="35 0 0" color="#000" material="flatShading: true"></a-tetrahedron>
          
          <!-- Detail Gigi Hitam (Garis Vertikal) -->
          <a-box width="0.05" height="0.2" depth="0.1" position="-0.15 -0.55 0.48" color="#000"></a-box>
          <a-box width="0.05" height="0.2" depth="0.1" position="0 -0.55 0.5" color="#000"></a-box>
          <a-box width="0.05" height="0.2" depth="0.1" position="0.15 -0.55 0.48" color="#000"></a-box>

          <!-- Cahaya merah darah yang memancar dari kepala tengkorak -->
          <a-light type="point" color="#ff0000" intensity="1.5" distance="6" position="0 0 0.5"></a-light>
          
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#1a2525"></a-light>
      <a-light type="point" color="#88cccc" intensity="0.4" position="0 15 0" distance="50"></a-light>

      <a-plane class="walkable" tap-to-move endless-ground rotation="-90 0 0" width="200" height="200" color="#030808" material="shader: flat"></a-plane>
      
      <a-entity endless-forest="treeCount: 200; radius: 50"></a-entity>

    </a-scene>
  </body>
</html>
