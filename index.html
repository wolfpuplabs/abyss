<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A Last Roban</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
      body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; user-select: none; }
      
      /* UI Start Menu */
      #start-menu {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }

      #start-menu-box {
        background: rgba(15, 25, 25, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 40px 60px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(4px);
      }

      #start-menu-box h1 {
        color: #ff4444;
        font-family: 'Courier New', monospace;
        font-size: 32px;
        margin-top: 0;
        margin-bottom: 25px;
        text-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        letter-spacing: 2px;
      }

      #start-menu-box p {
        color: #fff;
        font-family: monospace;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 40px;
      }

      .btn-glow {
        background: transparent;
        color: white;
        border: 2px solid #ff0000;
        border-radius: 4px;
        padding: 12px 35px;
        font-size: 18px;
        font-weight: bold;
        font-family: monospace;
        cursor: pointer;
        text-transform: uppercase;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5), inset 0 0 10px rgba(255, 0, 0, 0.3);
        transition: 0.3s;
        pointer-events: auto;
      }
      .btn-glow:hover { 
        background: rgba(255, 0, 0, 0.15); 
        box-shadow: 0 0 25px rgba(255, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.6);
      }

      /* HUD Elements */
      #hud-timer {
        display: none !important;
      }

      #hud-score {
        display: none;
        position: absolute;
        top: 20px; right: 20px;
        color: #00ffff;
        font-family: monospace;
        font-size: 20px;
        z-index: 9998;
        text-shadow: 2px 2px 5px #000, 0 0 10px #00ffff;
      }

      /* UI Stamina Bar */
      #stamina-container {
        display: none;
        position: absolute;
        bottom: 30px; left: 30px;
        width: 180px; height: 16px;
        background: rgba(0, 20, 20, 0.7);
        border: 2px solid #00ffff;
        border-radius: 8px;
        overflow: hidden;
        z-index: 9998;
        box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      }

      #stamina-bar {
        width: 100%; height: 100%;
        background: linear-gradient(90deg, #0088ff, #00ffff);
        transition: width 0.1s linear, background 0.3s;
      }

      /* Tombol Shield Skill */
      #shield-btn {
        display: none;
        position: absolute;
        bottom: 30px; left: 50%;
        transform: translateX(-50%);
        z-index: 9998;
        border-color: #00ffff;
        color: #00ffff;
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), inset 0 0 10px rgba(0, 255, 255, 0.3);
        animation: pulseBtn 1s infinite alternate;
      }
      #shield-btn:hover {
        background: rgba(0, 255, 255, 0.2);
        box-shadow: 0 0 25px rgba(0, 255, 255, 0.9), inset 0 0 20px rgba(0, 255, 255, 0.6);
      }

      @keyframes pulseBtn {
        from { transform: translateX(-50%) scale(1); }
        to { transform: translateX(-50%) scale(1.05); }
      }

      /* Black Fade Overlay Transisi */
      #fade-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000;
        z-index: 10000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
      }

      /* UI Checkpoint Video Fullscreen */
      #checkpoint-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; 
        width: 100vw; height: 100vh;
        background: #000;
        z-index: 10001;
        overflow: hidden;
        pointer-events: auto;
      }

      #cp-video {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        z-index: 1;
        display: none;
      }

      #cp-content {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 50px;
        padding: 20px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.9); 
        pointer-events: auto;
      }

      #cp-content h2 {
        color: #ffaa44;
        font-family: 'Courier New', monospace;
        text-shadow: 0 0 20px #ff6600, 0 0 10px #000;
        font-size: 32px;
        margin: 0;
        letter-spacing: 3px;
        text-align: center;
      }

      /* Layar Death Overlay */
      #death-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: 
          radial-gradient(circle at 30% 40%, #600000 0%, transparent 15%),
          radial-gradient(circle at 70% 60%, #800000 0%, transparent 20%),
          radial-gradient(circle at 50% 80%, #500000 0%, transparent 10%),
          radial-gradient(circle, transparent 20%, rgba(60, 0, 0, 0.8) 70%, #0a0000 100%);
        background-color: rgba(20, 0, 0, 0.6);
        animation: fadeInBlood 0.5s ease-out forwards;
      }
      
      @keyframes fadeInBlood {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      #death-text {
        color: #ff0000;
        font-family: 'Courier New', Courier, monospace;
        font-size: 10vw;
        font-weight: bold;
        margin: 0;
        text-shadow: 2px 2px 10px #000, 0 0 30px #880000;
      }

      #final-time {
        color: #fff;
        font-family: monospace;
        font-size: 2vw;
        margin-top: 10px;
        margin-bottom: 20px;
        text-shadow: 2px 2px 5px #000;
      }

      #best-time {
        color: #ffd700;
        font-family: monospace;
        font-size: 1.5vw;
        margin-top: 0px;
        margin-bottom: 40px;
      }
    </style>

    <script>
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      
      function playBGM() {
        if(window.bgmOsc) return;
        const bufferSize = audioCtx.sampleRate * 2; 
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400; 

        const whisperGain = audioCtx.createGain();
        whisperGain.gain.value = 0.2; 

        whiteNoise.connect(filter);
        filter.connect(whisperGain);
        whisperGain.connect(audioCtx.destination);
        whiteNoise.start(); 
        window.bgmOsc = whiteNoise;
      }

      function playDeathSound() {
        if (audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); 
        osc.stop(audioCtx.currentTime + 2);
      }

      function playElectricShieldSFX() {
        if (audioCtx.state !== 'running') return;
        
        const bufferSize = audioCtx.sampleRate * 0.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
        
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(3000, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.5);
        
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(2.0, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();

        const osc = audioCtx.createOscillator();
        const oscGain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.6);
        oscGain.gain.setValueAtTime(1.5, audioCtx.currentTime);
        oscGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        
        osc.connect(oscGain);
        oscGain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      }

      window.isGameOver = true; 
      window.isCheckpoint = false;
      window.gameTime = 0;
      window.gameScore = 0;
      window.nextCheckpoint = 120; 

      // -- SISTEM STAMINA & SPEED LEBIH CEPAT DAN AWET -- //
      window.stamina = 100;
      window.isSprinting = false;
      window.staminaExhausted = false;

      AFRAME.registerComponent('tap-to-move', {
        init: function () {
          this.rig = document.querySelector('#cameraRig');
          this.targetPoint = null;
          this.lastTapTime = 0;

          this.el.addEventListener('click', (evt) => {
            if (window.isGameOver || window.isCheckpoint) return; 
            
            let currentTime = new Date().getTime();
            let tapLength = currentTime - this.lastTapTime;
            
            // Double Tap Detection
            if (tapLength < 300 && tapLength > 0) {
              if (!window.staminaExhausted && window.stamina > 5) {
                window.isSprinting = true;
              }
            } else {
              window.isSprinting = false; // Single tap = Walk
            }
            this.lastTapTime = currentTime;

            this.targetPoint = evt.detail.intersection.point;
            this.moveToTarget();
          });
        },
        moveToTarget: function() {
          if (!this.targetPoint) return;
          let currentPos = this.rig.object3D.position;
          let dist = Math.sqrt(Math.pow(this.targetPoint.x - currentPos.x, 2) + Math.pow(this.targetPoint.z - currentPos.z, 2));
          
          // Kecepatan ditingkatkan: Walk = 7, Sprint = 22 (Sangat Cepat)
          let speed = (window.isSprinting && !window.staminaExhausted) ? 22 : 7; 
          let duration = (dist / speed) * 1000;

          this.rig.setAttribute('animation', {
            property: 'position',
            to: this.targetPoint.x + ' 0 ' + this.targetPoint.z,
            dur: duration, 
            easing: 'linear'
          });
        },
        tick: function (time, timeDelta) {
          if (window.isGameOver || window.isCheckpoint) return;

          let deltaSec = timeDelta / 1000;
          let staminaBar = document.getElementById('stamina-bar');

          if (window.isSprinting && !window.staminaExhausted) {
            window.stamina -= 12 * deltaSec; // Stamina terpakai jauh lebih hemat (Lari lebih lama)
            if (this.targetPoint) this.moveToTarget();

            if (window.stamina <= 0) {
              window.stamina = 0;
              window.staminaExhausted = true;
              window.isSprinting = false;
              if (staminaBar) staminaBar.style.background = '#ff0000';
            }
          } else {
            window.stamina += 25 * deltaSec; // Regenerasi stamina lebih cepat
            if (window.stamina >= 100) {
              window.stamina = 100;
              window.staminaExhausted = false;
              if (staminaBar) staminaBar.style.background = 'linear-gradient(90deg, #0088ff, #00ffff)';
            }
          }

          if (staminaBar) staminaBar.style.width = window.stamina + '%';
        }
      });

      AFRAME.registerComponent('endless-ground', {
        tick: function () {
          var camPos = document.querySelector('#cameraRig').object3D.position;
          this.el.object3D.position.set(camPos.x, 0, camPos.z);
        }
      });

      AFRAME.registerComponent('endless-forest', {
        schema: { treeCount: {type: 'int', default: 200}, radius: {type: 'number', default: 50} },
        init: function () {
          this.trees = [];
          this.cameraRig = document.querySelector('#cameraRig');
          for (let i = 0; i < this.data.treeCount; i++) {
            let tree = document.createElement('a-cylinder');
            tree.setAttribute('color', '#020505');
            tree.setAttribute('material', 'shader: flat; roughness: 1');
            let radius = Math.random() * 0.4 + 0.1;
            let height = Math.random() * 20 + 10;
            tree.setAttribute('radius', radius);
            tree.setAttribute('height', height);
            this.repositionTree(tree, true);
            this.el.appendChild(tree);
            this.trees.push({el: tree, height: height});
          }
        },
        tick: function () {
          let camPos = this.cameraRig.object3D.position;
          for (let treeObj of this.trees) {
            let treePos = treeObj.el.object3D.position;
            let dx = treePos.x - camPos.x;
            let dz = treePos.z - camPos.z;
            if (Math.sqrt(dx*dx + dz*dz) > this.data.radius) {
              this.repositionTree(treeObj.el, false);
            }
          }
        },
        repositionTree: function (tree, isInit) {
          let camPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = isInit ? Math.random() * this.data.radius : this.data.radius - 2;
          if (isInit && dist < 4) dist += 5;
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          tree.object3D.position.set(tx, tree.getAttribute('height') / 2, tz);
        }
      });

      AFRAME.registerComponent('wisp-system', {
        schema: { count: {type: 'int', default: 3}, radius: {type: 'number', default: 60} }, 
        init: function () {
          this.wisps = [];
          this.cameraRig = document.querySelector('#cameraRig');
          
          for (let i = 0; i < this.data.count; i++) {
            let wisp = document.createElement('a-entity');

            let core = document.createElement('a-sphere');
            core.setAttribute('radius', '0.3');
            core.setAttribute('color', '#00ffff');
            core.setAttribute('material', 'shader: flat; transparent: true; opacity: 0.5; wireframe: false');
            wisp.appendChild(core);

            let ring = document.createElement('a-torus');
            ring.setAttribute('radius', '0.5');
            ring.setAttribute('radius-tubular', '0.02');
            ring.setAttribute('color', '#00ffff');
            ring.setAttribute('material', 'shader: flat; transparent: true; opacity: 0.6');
            ring.setAttribute('rotation', '45 45 0');
            ring.setAttribute('animation', 'property: rotation; to: 405 405 0; loop: true; dur: 3000; easing: linear');
            wisp.appendChild(ring);
            
            let light = document.createElement('a-light');
            light.setAttribute('type', 'point');
            light.setAttribute('color', '#00ffff');
            light.setAttribute('intensity', '2.5');
            light.setAttribute('distance', '8');
            wisp.appendChild(light);

            this.repositionWisp(wisp);
            this.el.sceneEl.appendChild(wisp);
            this.wisps.push(wisp);
          }
        },
        tick: function () {
          if (window.isGameOver || window.isCheckpoint) return;
          
          let camPos = this.cameraRig.object3D.position;
          
          for (let wisp of this.wisps) {
            let wispPos = wisp.object3D.position;
            let dist = camPos.distanceTo(wispPos);
            
            if (dist < 2.2) {
              window.gameScore += 1;
              document.getElementById('score-val').innerText = window.gameScore;
              
              if (window.gameScore >= 5) {
                document.getElementById('shield-btn').style.display = 'block';
              }

              this.repositionWisp(wisp);
            }
            else if (dist > this.data.radius + 15) {
              this.repositionWisp(wisp);
            }
          }
        },
        repositionWisp: function (wisp) {
          let camPos = this.cameraRig.object3D.position;
          let angle = (Math.random() * Math.PI) - (Math.PI / 2); 
          let dist = 20 + Math.random() * (this.data.radius - 20); 
          
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          
          wisp.object3D.position.set(tx, 1.2, tz);
          wisp.setAttribute('animation', {
            property: 'position',
            to: `${tx} 1.8 ${tz}`,
            dir: 'alternate',
            dur: 1500,
            loop: true,
            easing: 'easeInOutSine'
          });
        }
      });

      AFRAME.registerComponent('apparition-system', {
        init: function () {
          this.cameraRig = document.querySelector('#cameraRig');
          this.timer = 0;
          this.resetTimer();

          this.ghost = document.createElement('a-entity');
          let body = document.createElement('a-cone');
          body.setAttribute('radius-bottom', '0.6');
          body.setAttribute('radius-top', '0.01');
          body.setAttribute('height', '2.5');
          body.setAttribute('color', '#000000');
          body.setAttribute('material', 'shader: flat; transparent: true; opacity: 0.75');
          body.setAttribute('rotation', '90 0 0');
          this.ghost.appendChild(body);

          this.ghost.setAttribute('visible', 'false');
          this.el.sceneEl.appendChild(this.ghost);
        },
        resetTimer: function () {
          this.timer = 8000 + Math.random() * 10000;
        },
        tick: function (time, timeDelta) {
          if (window.isGameOver || window.isCheckpoint) return;

          this.timer -= timeDelta;
          if (this.timer <= 0) {
            this.triggerApparition();
            this.resetTimer();
          }
        },
        triggerApparition: function () {
          let camPos = this.cameraRig.object3D.position;
          
          let side = Math.random() < 0.5 ? -1 : 1;
          let startX = camPos.x + (side * 20);
          let startZ = camPos.z - (15 + Math.random() * 15);
          let endX = camPos.x + (-side * 25);
          let endZ = startZ + (Math.random() * 10 - 5);

          this.ghost.object3D.position.set(startX, 2.5 + Math.random() * 2, startZ);
          this.ghost.object3D.lookAt(endX, 2.5, endZ);
          this.ghost.setAttribute('visible', 'true');

          this.ghost.setAttribute('animation', {
            property: 'position',
            to: `${endX} ${1.5 + Math.random() * 2} ${endZ}`,
            dur: 800,
            easing: 'easeInQuad'
          });

          setTimeout(() => {
            this.ghost.setAttribute('visible', 'false');
            this.ghost.removeAttribute('animation');
          }, 850);
        }
      });

      AFRAME.registerComponent('threat-system', {
        init: function () {
          this.cameraRig = document.querySelector('#cameraRig');
          this.active = false;
          this.baseSpeed = 4.5;
          this.speed = this.baseSpeed; 
          this.threatPos = new THREE.Vector3();
          this.isStunned = false;
        },
        startGame: function () {
          this.active = true;
          window.isGameOver = false;
          window.isCheckpoint = false;
          window.stamina = 100;
          this.isStunned = false;
          
          document.getElementById('hud-score').style.display = 'block';
          document.getElementById('stamina-container').style.display = 'block';
          document.getElementById('shield-btn').style.display = 'none';

          let rigPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = 25;
          
          this.threatPos.set(
            rigPos.x + Math.cos(angle) * dist,
            1.6, 
            rigPos.z + Math.sin(angle) * dist
          );
          
          this.el.object3D.position.copy(this.threatPos);
          this.el.setAttribute('visible', 'true');
          
          if (this.el.components.sound) this.el.components.sound.playSound();
        },
        triggerShield: function () {
          if (window.gameScore < 5 || window.isGameOver || window.isCheckpoint) return;

          window.gameScore -= 5;
          document.getElementById('score-val').innerText = window.gameScore;

          if (window.gameScore < 5) {
            document.getElementById('shield-btn').style.display = 'none';
          }

          playElectricShieldSFX();

          let rigPos = this.cameraRig.object3D.position;
          let dome = document.createElement('a-sphere');
          dome.setAttribute('position', `${rigPos.x} 1.6 ${rigPos.z}`);
          dome.setAttribute('radius', '1');
          dome.setAttribute('color', '#00ffff');
          dome.setAttribute('material', 'shader: flat; transparent: true; opacity: 0.8; side: double');
          dome.setAttribute('animation__scale', 'property: radius; to: 35; dur: 400; easing: easeOutQuad');
          dome.setAttribute('animation__fade', 'property: material.opacity; to: 0; dur: 450; easing: easeInExpo');

          let light = document.createElement('a-light');
          light.setAttribute('type', 'point');
          light.setAttribute('color', '#00ffff');
          light.setAttribute('intensity', '10');
          light.setAttribute('distance', '40');
          dome.appendChild(light);

          this.el.sceneEl.appendChild(dome);

          setTimeout(() => { dome.parentNode.removeChild(dome); }, 500);

          let dir = new THREE.Vector3().subVectors(this.threatPos, rigPos).normalize();
          dir.y = 0;
          this.threatPos.addScaledVector(dir, 35);
          this.el.object3D.position.copy(this.threatPos);

          this.isStunned = true;
          setTimeout(() => { this.isStunned = false; }, 3000);
        },
        triggerCheckpoint: function() {
          window.isCheckpoint = true;
          this.active = false; 

          this.cameraRig.removeAttribute('animation');
          if (this.el.components.sound) this.el.components.sound.pauseSound();

          const fade = document.getElementById('fade-overlay');
          fade.style.opacity = '1';

          setTimeout(() => {
            const cpOverlay = document.getElementById('checkpoint-overlay');
            const cpContent = document.getElementById('cp-content');
            const cpVideo = document.getElementById('cp-video');
            
            cpOverlay.style.display = 'block';
            cpContent.style.display = 'flex'; 
            cpVideo.style.display = 'none';   
            
            fade.style.opacity = '0';
          }, 1000);
          
          this.speed += 0.5; 
        },
        resumeFromCheckpoint: function() {
          if(!window.isCheckpoint) return; 

          const fade = document.getElementById('fade-overlay');
          fade.style.opacity = '1';

          setTimeout(() => {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            const cpVideo = document.getElementById('cp-video');
            cpVideo.pause();

            window.isCheckpoint = false;
            this.active = true;
            
            let rigPos = this.cameraRig.object3D.position;
            let dir = new THREE.Vector3().subVectors(this.threatPos, rigPos).normalize();
            this.threatPos.addScaledVector(dir, 12); 
            
            if (this.el.components.sound) this.el.components.sound.playSound();
            fade.style.opacity = '0';
          }, 1000);
        },
        triggerDeath: function () {
          window.isGameOver = true;
          this.active = false;
          
          if (this.el.components.sound) this.el.components.sound.stopSound();

          let rigPos = this.cameraRig.object3D.position;
          this.el.object3D.position.set(rigPos.x, rigPos.y + 0.5, rigPos.z - 3.0);
          this.el.object3D.lookAt(rigPos);

          this.cameraRig.removeAttribute('animation');
          document.getElementById('shield-btn').style.display = 'none';
          document.getElementById('stamina-container').style.display = 'none';
          
          let bestTime = localStorage.getItem('lastRobanBestTime') || 0;
          if (window.gameTime > bestTime) {
            bestTime = window.gameTime;
            localStorage.setItem('lastRobanBestTime', bestTime);
          }
          
          document.getElementById('final-time-val').innerText = window.gameTime.toFixed(1);
          document.getElementById('best-time-val').innerText = parseFloat(bestTime).toFixed(1);
          document.getElementById('death-overlay').style.display = 'flex';
          
          playDeathSound();
        },
        tick: function (time, timeDelta) {
          if (!window.isGameOver && !window.isCheckpoint) {
            window.gameTime += (timeDelta / 1000);

            if (window.gameTime >= window.nextCheckpoint) {
              window.nextCheckpoint += 120;
              this.triggerCheckpoint();
              return;
            }
          }

          if (!this.active || window.isGameOver || window.isCheckpoint || this.isStunned) return;

          let rigPos = this.cameraRig.object3D.position;
          let distToPlayer = this.threatPos.distanceTo(rigPos);

          if (distToPlayer < 3.8) {
            this.triggerDeath();
            return;
          }

          let dir = new THREE.Vector3().subVectors(rigPos, this.threatPos).normalize();
          dir.y = 0; 
          
          let moveDist = this.speed * (timeDelta / 1000);
          this.threatPos.addScaledVector(dir, moveDist);
          this.el.object3D.position.copy(this.threatPos);
          this.el.object3D.lookAt(rigPos); 
        }
      });

      document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        const startMenu = document.getElementById('start-menu');
        const restartBtn = document.getElementById('restart-btn');
        const cpResumeBtn = document.getElementById('resume-cp-btn');
        const shieldBtn = document.getElementById('shield-btn');
        const cpVideo = document.getElementById('cp-video');
        const cpContent = document.getElementById('cp-content');
        let bgmStarted = false;

        function initAudioAndStart() {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          
          if(!bgmStarted) {
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer; source.connect(audioCtx.destination);
            if (source.start) source.start(0); else source.noteOn(0);
            playBGM();
            bgmStarted = true;
          }
          
          setTimeout(() => {
            const threatEntity = document.querySelector('#threatEntity');
            if (threatEntity && threatEntity.components['threat-system']) {
              threatEntity.components['threat-system'].startGame();
            }
          }, 1000);
        }

        startBtn.addEventListener('click', () => {
          startMenu.style.display = 'none';
          initAudioAndStart();
        });

        shieldBtn.addEventListener('click', () => {
          const threatEntity = document.querySelector('#threatEntity');
          if (threatEntity && threatEntity.components['threat-system']) {
            threatEntity.components['threat-system'].triggerShield();
          }
        });

        cpResumeBtn.addEventListener('click', () => {
          cpContent.style.display = 'none'; 
          cpVideo.style.display = 'block';  
          
          cpVideo.currentTime = 0;
          cpVideo.muted = false; 
          
          cpVideo.play().catch(error => {
            console.log("Video gagal diputar:", error);
            const threatEntity = document.querySelector('#threatEntity');
            if (threatEntity) threatEntity.components['threat-system'].resumeFromCheckpoint();
          });
        });

        cpVideo.addEventListener('ended', () => {
          const threatEntity = document.querySelector('#threatEntity');
          if (threatEntity && window.isCheckpoint) {
            threatEntity.components['threat-system'].resumeFromCheckpoint();
          }
        });

        restartBtn.addEventListener('click', () => {
          document.getElementById('death-overlay').style.display = 'none';
          window.gameTime = 0;
          window.gameScore = 0;
          window.nextCheckpoint = 120;
          document.getElementById('score-val').innerText = "0";
          
          const camRig = document.querySelector('#cameraRig');
          camRig.removeAttribute('animation');
          camRig.object3D.position.set(0, 0, 0);
          
          const threatEntity = document.querySelector('#threatEntity');
          if (threatEntity) {
            threatEntity.components['threat-system'].speed = threatEntity.components['threat-system'].baseSpeed;
            let angle = Math.random() * Math.PI * 2;
            let dist = 25;
            threatEntity.object3D.position.set(Math.cos(angle) * dist, 1.6, Math.sin(angle) * dist);
          }

          initAudioAndStart();
        });
      });
    </script>
  </head>
  <body>
    
    <div id="fade-overlay"></div>

    <div id="start-menu">
      <div id="start-menu-box">
        <h1>SURVIVE THE LIMBO</h1>
        <p>Single Tap to Walk.<br>Double Tap to Sprint.<br>Move AWAY from the ghostly sound.</p>
        <button class="btn-glow" id="start-btn">ENTER SURVIVAL</button>
      </div>
    </div>

    <div id="hud-timer">Time: <span id="timer-val">0.0</span>s</div>
    <div id="hud-score">Heirlooms: <span id="score-val">0</span></div>

    <!-- UI Bar Stamina -->
    <div id="stamina-container">
      <div id="stamina-bar"></div>
    </div>

    <!-- Tombol Shield -->
    <button class="btn-glow" id="shield-btn">TRIGGER SHIELD</button>

    <div id="checkpoint-overlay">
      <video id="cp-video" src="checkpoint.mp4" playsinline preload="auto" crossorigin="anonymous"></video>
      <div id="cp-content">
        <h2>SEEMS IT'S SAFE FOR A WHILE</h2>
        <button class="btn-glow" id="resume-cp-btn">REST</button>
      </div>
    </div>

    <div id="death-overlay">
      <h1 id="death-text">YOU DIED</h1>
      <p id="final-time">Time: <span id="final-time-val" style="color: #ff0000; font-weight: bold;">0.0</span>s</p>
      <p id="best-time">Best Time: <span id="best-time-val">0.0</span>s</p>
      <button class="btn-glow" style="background: #110000;" id="restart-btn">PLAY AGAIN</button>
    </div>

    <a-scene fog="type: exponential; color: #071313; density: 0.065" background="color: #071313">
      <a-assets>
        <a-asset-item id="dementor-model" src="dementor.glb"></a-asset-item>
        <audio id="howl-sound" src="howl.mp3" preload="auto"></audio>
      </a-assets>

      <a-entity id="cameraRig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          <a-entity cursor="rayOrigin: mouse;"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #ffffff; shader: flat; opacity: 0.4">
          </a-entity>
        </a-camera>
      </a-entity>

      <a-entity id="threatEntity" visible="false" threat-system 
                sound="src: #howl-sound; loop: true; autoplay: false; distanceModel: linear; maxDistance: 25; refDistance: 5; volume: 1.5">
        <a-entity animation="property: position; to: 0 0.5 0; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine">
          <a-gltf-model src="#dementor-model" position="0 0 0" scale="4.5 4.5 4.5"></a-gltf-model>
          <a-light type="point" color="#ff0000" intensity="2.0" distance="10" position="0 1.5 0.5"></a-light>
        </a-entity>
      </a-entity>

      <a-light type="ambient" color="#1a2525" intensity="0.3"></a-light>
      <a-light type="point" color="#88cccc" intensity="0.4" position="0 15 0" distance="50"></a-light>

      <a-plane class="walkable" tap-to-move endless-ground rotation="-90 0 0" width="200" height="200" color="#030808" material="shader: flat"></a-plane>
      <a-entity endless-forest="treeCount: 200; radius: 50"></a-entity>
      <a-entity wisp-system></a-entity>
      <a-entity apparition-system></a-entity>
    </a-scene>
  </body>
</html>
