<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Endless VR Limbo - Shadow Dash Scare</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
      #ui-container {
        position: absolute;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
      }
      #scareToggle {
        background: rgba(10, 10, 10, 0.8);
        border: 2px solid #555;
        border-radius: 50%;
        width: 55px;
        height: 55px;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }
      #scareToggle.active {
        border-color: #ff0000;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        background: rgba(40, 0, 0, 0.8);
      }
    </style>

    <script>
      // INISIALISASI AUDIO & UNLOCKER UNTUK MOBILE
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();

      function unlockAudio() {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        if (source.start) source.start(0);
        else source.noteOn(0);

        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('click', unlockAudio);
      }
      window.addEventListener('touchstart', unlockAudio, false);
      window.addEventListener('click', unlockAudio, false);

      // 1. Sistem Tap to Move
      AFRAME.registerComponent('tap-to-move', {
        init: function () {
          var rig = document.querySelector('#cameraRig');
          this.el.addEventListener('click', function (evt) {
            var point = evt.detail.intersection.point;
            rig.setAttribute('animation', {
              property: 'position',
              to: point.x + ' 0 ' + point.z,
              dur: 1500,
              easing: 'easeOutCubic'
            });
          });
        }
      });

      // 2. Sistem Endless Ground
      AFRAME.registerComponent('endless-ground', {
        tick: function () {
          var camPos = document.querySelector('#cameraRig').object3D.position;
          this.el.object3D.position.set(camPos.x, 0, camPos.z);
        }
      });

      // 3. Sistem Endless Forest
      AFRAME.registerComponent('endless-forest', {
        schema: { treeCount: {type: 'int', default: 250}, radius: {type: 'number', default: 50} },
        init: function () {
          this.trees = [];
          this.cameraRig = document.querySelector('#cameraRig');
          for (let i = 0; i < this.data.treeCount; i++) {
            let tree = document.createElement('a-cylinder');
            tree.setAttribute('color', '#000000');
            tree.setAttribute('material', 'shader: flat; roughness: 1');
            let radius = Math.random() * 0.5 + 0.1;
            let height = Math.random() * 20 + 10;
            tree.setAttribute('radius', radius);
            tree.setAttribute('height', height);
            this.repositionTree(tree, true);
            this.el.appendChild(tree);
            this.trees.push({el: tree, height: height});
          }
        },
        tick: function () {
          let camPos = this.cameraRig.object3D.position;
          for (let treeObj of this.trees) {
            let treePos = treeObj.el.object3D.position;
            let dx = treePos.x - camPos.x;
            let dz = treePos.z - camPos.z;
            if (Math.sqrt(dx*dx + dz*dz) > this.data.radius) {
              this.repositionTree(treeObj.el, false);
            }
          }
        },
        repositionTree: function (tree, isInit) {
          let camPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = isInit ? Math.random() * this.data.radius : this.data.radius - 2;
          if (isInit && dist < 4) dist += 5;
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          tree.object3D.position.set(tx, tree.getAttribute('height') / 2, tz);
        }
      });

      // 4. Sistem Jump Scare (Bayangan Melesat & Partikel)
      document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('scareToggle');
        const scareEntity = document.getElementById('scareEntity');
        
        let scareActive = true; 
        let scareTimer = null;

        function playShadowDashSound() {
          if (audioCtx.state !== 'running') return; 
          
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          
          // Suara whoosh bass (frekuensi rendah)
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(80, audioCtx.currentTime);
          osc1.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.4);
          
          // Suara distorsi/angin
          osc2.type = 'sawtooth';
          osc2.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.4);

          // Volume membesar saat bayangan mendekat (0.2s), lalu hilang saat asap mengepul
          gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(3, audioCtx.currentTime + 0.2);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
          
          osc1.connect(gainNode);
          osc2.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          
          osc1.start(); osc2.start();
          osc1.stop(audioCtx.currentTime + 0.7); osc2.stop(audioCtx.currentTime + 0.7);
        }

        function triggerScare() {
          if (!scareActive) return;
          
          // Reset posisi di kejauhan (-15) dan ukuran normal (1 1 1)
          scareEntity.setAttribute('position', '0 0 -15');
          scareEntity.setAttribute('scale', '1 1 1');
          scareEntity.setAttribute('visible', 'true');
          
          // Animasi melesat mendekat ke kamera
          scareEntity.setAttribute('animation__dash', {
            property: 'position',
            to: '0 0 -0.5',
            dur: 250,
            easing: 'easeInCubic'
          });

          // Animasi meledak menjadi asap (skala membesar saat mengenai wajah)
          scareEntity.setAttribute('animation__smoke', {
            property: 'scale',
            to: '15 15 15',
            dur: 400,
            delay: 200, // Mulai meledak saat hampir menabrak wajah
            easing: 'easeOutQuad'
          });

          playShadowDashSound();
          
          // Sembunyikan setelah efek selesai dan jadwalkan scare berikutnya
          setTimeout(() => {
            scareEntity.setAttribute('visible', 'false');
            scheduleNextScare();
          }, 650); 
        }

        function scheduleNextScare() {
          if (!scareActive) return;
          const nextScareTime = Math.random() * 15000 + 8000; 
          scareTimer = setTimeout(triggerScare, nextScareTime);
        }

        scheduleNextScare();

        toggleBtn.addEventListener('click', () => {
          scareActive = !scareActive;
          if (scareActive) {
            toggleBtn.classList.add('active');
            toggleBtn.innerHTML = '👁️'; 
            scheduleNextScare();
          } else {
            toggleBtn.classList.remove('active');
            toggleBtn.innerHTML = '🔕'; 
            clearTimeout(scareTimer);
            scareEntity.setAttribute('visible', 'false');
          }
        });
      });
    </script>
  </head>
  <body>
    
    <div id="ui-container">
      <button id="scareToggle" class="active" title="Toggle Scare">👁️</button>
    </div>

    <!-- Warna gelap Limbo (#0a0a0a) -->
    <a-scene fog="type: exponential; color: #0a0a0a; density: 0.08" background="color: #0a0a0a">

      <a-entity id="cameraRig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          
          <!-- Cursor -->
          <a-entity cursor="rayOrigin: mouse;"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #ffffff; shader: flat; opacity: 0.5">
          </a-entity>
          
          <!-- ENTITAS BAYANGAN & PARTIKEL ASAP -->
          <a-entity id="scareEntity" visible="false" position="0 0 -15">
            <!-- Inti bayangan hitam pekat -->
            <a-sphere radius="0.5" color="#000000" material="shader: flat; transparent: true; opacity: 0.95" scale="1 1.5 1"></a-sphere>
            <!-- Lapisan asap 1 (abu-abu gelap) -->
            <a-sphere radius="0.8" color="#111111" material="shader: flat; transparent: true; opacity: 0.6" position="0.2 0.2 0.2"></a-sphere>
            <!-- Lapisan asap 2 (tepian transparan) -->
            <a-sphere radius="1.2" color="#1a1a1a" material="shader: flat; transparent: true; opacity: 0.3" position="-0.2 -0.1 0.1"></a-sphere>
          </a-entity>

        </a-camera>
      </a-entity>

      <!-- Lighting -->
      <a-light type="ambient" color="#111"></a-light>
      <a-light type="point" color="#ffffff" intensity="0.6" position="0 15 0" distance="50"></a-light>

      <!-- Lantai -->
      <a-plane class="walkable" tap-to-move endless-ground rotation="-90 0 0" width="200" height="200" color="#050505" material="shader: flat"></a-plane>
      
      <!-- Hutan Endless -->
      <a-entity endless-forest="treeCount: 250; radius: 50"></a-entity>

    </a-scene>
  </body>
</html>
