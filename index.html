<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Endless VR Limbo - Binaural Survival</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
      body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
      
      #death-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999;
        pointer-events: none;
        background: 
          radial-gradient(circle at 30% 40%, #600000 0%, transparent 15%),
          radial-gradient(circle at 70% 60%, #800000 0%, transparent 20%),
          radial-gradient(circle at 50% 80%, #500000 0%, transparent 10%),
          radial-gradient(circle, transparent 20%, rgba(60, 0, 0, 0.8) 70%, #0a0000 100%);
        background-color: rgba(20, 0, 0, 0.6);
        animation: fadeInBlood 0.3s ease-out forwards;
      }
      
      @keyframes fadeInBlood {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      #death-text {
        position: absolute;
        top: 50%; width: 100%;
        transform: translateY(-50%);
        text-align: center;
        color: #ff0000;
        font-family: 'Courier New', Courier, monospace;
        font-size: 12vw;
        font-weight: bold;
        margin: 0;
        text-shadow: 2px 2px 10px #000, 0 0 30px #880000;
      }
      
      #instruction {
        position: absolute;
        top: 20px; width: 100%;
        text-align: center;
        color: #fff;
        font-family: monospace;
        font-size: 16px;
        z-index: 9998;
        pointer-events: none;
        text-shadow: 0 0 5px #000;
        transition: opacity 1s;
      }
    </style>

    <script>
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      let threatPanner; // Node untuk Spatial Audio (Binaural)
      
      window.isGameOver = false;
      window.gameStarted = false;

      // -- SISTEM SFX FOOTSTEP (Langkah kaki pemain, tidak di-spatial) -- //
      function playFootstep() {
        if (audioCtx.state !== 'running') return;
        const bufferSize = audioCtx.sampleRate * 0.1; 
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1200; 

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      }

      // -- SISTEM LENGKINGAN MONSTER (Disambung ke Panner/Spatial Audio) -- //
      function playScreech() {
        if (audioCtx.state !== 'running' || !threatPanner) return;
        const osc = audioCtx.createOscillator();
        const envelope = audioCtx.createGain();
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(2800, audioCtx.currentTime + 0.3);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.6);
        
        // Volume murni, redaman jarak (attenuation) akan diurus otomatis oleh HRTF Panner
        envelope.gain.setValueAtTime(0.01, audioCtx.currentTime);
        envelope.gain.linearRampToValueAtTime(3.0, audioCtx.currentTime + 0.1);
        envelope.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        
        osc.connect(envelope);
        // Sambungkan ke Panner Spatial, bukan ke destination utama
        envelope.connect(threatPanner);
        
        osc.start(); 
        osc.stop(audioCtx.currentTime + 1);
      }

      function playDeathSound() {
        if (audioCtx.state !== 'running' || !threatPanner) return;
        const osc = audioCtx.createOscillator();
        const envelope = audioCtx.createGain();
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
        
        envelope.gain.setValueAtTime(5, audioCtx.currentTime);
        envelope.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        
        osc.connect(envelope);
        envelope.connect(threatPanner); // Suara kematian juga dari posisi monster
        osc.start(); 
        osc.stop(audioCtx.currentTime + 2);
      }

      // -- UNLOCK AUDIO & INIT SPATIAL PANNER -- //
      function unlockAudio() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        // Pancing browser
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer; source.connect(audioCtx.destination);
        if (source.start) source.start(0); else source.noteOn(0);
        
        // Setup PannerNode dengan HRTF untuk Spatial 3D
        if (!threatPanner) {
          threatPanner = audioCtx.createPanner();
          threatPanner.panningModel = 'HRTF'; // Rahasia efek Binaural
          threatPanner.distanceModel = 'inverse';
          threatPanner.refDistance = 2; // Titik maksimal suara paling keras
          threatPanner.maxDistance = 40; // Batas redaman
          threatPanner.rolloffFactor = 1.5;
          threatPanner.connect(audioCtx.destination);
        }

        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('mousedown', unlockAudio);
      }
      window.addEventListener('touchstart', unlockAudio, false);
      window.addEventListener('mousedown', unlockAudio, false);


      // -- SISTEM JALAN -- //
      AFRAME.registerComponent('player-movement', {
        init: function () {
          this.targetPos = null;
          this.speed = 4.5; 
          this.nextStepTime = 0;
          this.rig = document.querySelector('#cameraRig');

          let walkable = document.querySelector('.walkable');
          walkable.addEventListener('click', (evt) => {
            if (window.isGameOver) return;
            this.targetPos = evt.detail.intersection.point;
            
            if (!window.gameStarted) {
              window.gameStarted = true;
              document.getElementById('instruction').style.opacity = '0';
              document.querySelector('#threatEntity').components['threat-system'].startChase();
            }
          });
        },
        tick: function (time, timeDelta) {
          if (window.isGameOver || !this.targetPos) return;

          let currentPos = this.rig.object3D.position;
          let dist = currentPos.distanceTo(this.targetPos);

          if (dist > 0.1) {
            let dir = this.targetPos.clone().sub(currentPos).normalize();
            dir.y = 0; 
            let moveDist = this.speed * (timeDelta / 1000);
            if (moveDist > dist) moveDist = dist; 
            
            currentPos.addScaledVector(dir, moveDist);

            if (time > this.nextStepTime) {
              playFootstep();
              this.nextStepTime = time + 350; 
            }
          }
        }
      });

      // -- SISTEM GENERATOR SCENERY -- //
      AFRAME.registerComponent('endless-scenery', {
        schema: { itemsCount: {type: 'int', default: 300}, radius: {type: 'number', default: 50} },
        init: function () {
          this.items = [];
          this.cameraRig = document.querySelector('#cameraRig');
          
          for (let i = 0; i < this.data.itemsCount / 2; i++) {
            let tree = document.createElement('a-cylinder');
            tree.setAttribute('color', '#010202');
            tree.setAttribute('material', 'shader: flat');
            let radius = Math.random() * 0.4 + 0.1;
            let height = Math.random() * 20 + 10;
            tree.setAttribute('radius', radius);
            tree.setAttribute('height', height);
            this.repositionItem(tree, true, height / 2);
            this.el.appendChild(tree);
            this.items.push({el: tree, yOffset: height / 2});
          }

          for (let i = 0; i < this.data.itemsCount / 2; i++) {
            let bush = document.createElement('a-sphere');
            bush.setAttribute('color', '#000000');
            bush.setAttribute('material', 'shader: flat');
            let radius = Math.random() * 1.5 + 0.5;
            bush.setAttribute('radius', radius);
            bush.setAttribute('scale', '1 0.6 1'); 
            this.repositionItem(bush, true, radius * 0.4);
            this.el.appendChild(bush);
            this.items.push({el: bush, yOffset: radius * 0.4});
          }
        },
        tick: function () {
          let camPos = this.cameraRig.object3D.position;
          for (let obj of this.items) {
            let itemPos = obj.el.object3D.position;
            let dx = itemPos.x - camPos.x;
            let dz = itemPos.z - camPos.z;
            if (Math.sqrt(dx*dx + dz*dz) > this.data.radius) {
              this.repositionItem(obj.el, false, obj.yOffset);
            }
          }
        },
        repositionItem: function (el, isInit, yOff) {
          let camPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = isInit ? Math.random() * this.data.radius : this.data.radius - 2;
          if (isInit && dist < 3) dist += 5; 
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          el.object3D.position.set(tx, yOff, tz);
        }
      });

      AFRAME.registerComponent('endless-ground', {
        tick: function () {
          var camPos = document.querySelector('#cameraRig').object3D.position;
          this.el.object3D.position.set(camPos.x, 0, camPos.z);
        }
      });

      // -- SISTEM PENGEJAR & PENGHITUNG SPATIAL AUDIO -- //
      AFRAME.registerComponent('threat-system', {
        init: function () {
          this.cameraRig = document.querySelector('#cameraRig');
          this.vrCamera = document.querySelector('a-camera');
          this.active = false;
          this.speed = 4.2; 
          this.screechTimer = 0;
          this.threatPos = new THREE.Vector3();
        },
        startChase: function () {
          this.active = true;
          window.isGameOver = false;
          
          let rigPos = this.cameraRig.object3D.position;
          // Spawn di belakang (Z + 25) dengan variasi sudut agar suara terasa dari arah acak
          let angle = Math.random() * Math.PI * 2;
          this.threatPos.set(rigPos.x + Math.cos(angle)*25, 1.5, rigPos.z + Math.sin(angle)*25);
          
          this.el.object3D.position.copy(this.threatPos);
          this.el.setAttribute('visible', 'true');
        },
        triggerDeath: function () {
          window.isGameOver = true;
          this.active = false;
          
          let rigPos = this.cameraRig.object3D.position;
          this.el.object3D.position.set(rigPos.x, rigPos.y + 1.5, rigPos.z - 1.5);
          
          document.getElementById('death-overlay').style.display = 'block';
          playDeathSound();
        },
        tick: function (time, timeDelta) {
          if (!this.active || window.isGameOver) return;

          let rigPos = this.cameraRig.object3D.position;
          let distToPlayer = this.threatPos.distanceTo(rigPos);

          if (distToPlayer < 3.5) {
            this.triggerDeath();
            return;
          }

          // Move Monster
          let dir = new THREE.Vector3().subVectors(rigPos, this.threatPos).normalize();
          dir.y = 0; 
          let moveDist = this.speed * (timeDelta / 1000);
          this.threatPos.addScaledVector(dir, moveDist);
          this.el.object3D.position.copy(this.threatPos);
          this.el.object3D.lookAt(rigPos); 

          // === UPDATE SPATIAL AUDIO KORDINAT (BINAURAL MAGIC) ===
          if (threatPanner && audioCtx.state === 'running') {
            
            // 1. Update Posisi Listener (Pemain / Kamera)
            const listener = audioCtx.listener;
            let camWorldPos = new THREE.Vector3();
            let camWorldDir = new THREE.Vector3();
            this.vrCamera.object3D.getWorldPosition(camWorldPos);
            this.vrCamera.object3D.getWorldDirection(camWorldDir);
            
            // ThreeJS look direction is -Z, spatial audio works differently so we invert
            camWorldDir.multiplyScalar(-1); 
            
            if (listener.positionX) {
              // API Modern
              listener.positionX.setTargetAtTime(camWorldPos.x, audioCtx.currentTime, 0.05);
              listener.positionY.setTargetAtTime(camWorldPos.y, audioCtx.currentTime, 0.05);
              listener.positionZ.setTargetAtTime(camWorldPos.z, audioCtx.currentTime, 0.05);
              listener.forwardX.setTargetAtTime(camWorldDir.x, audioCtx.currentTime, 0.05);
              listener.forwardY.setTargetAtTime(camWorldDir.y, audioCtx.currentTime, 0.05);
              listener.forwardZ.setTargetAtTime(camWorldDir.z, audioCtx.currentTime, 0.05);
              listener.upX.setTargetAtTime(0, audioCtx.currentTime, 0.05);
              listener.upY.setTargetAtTime(1, audioCtx.currentTime, 0.05);
              listener.upZ.setTargetAtTime(0, audioCtx.currentTime, 0.05);
            } else {
              // Fallback Browser Lama
              listener.setPosition(camWorldPos.x, camWorldPos.y, camWorldPos.z);
              listener.setOrientation(camWorldDir.x, camWorldDir.y, camWorldDir.z, 0, 1, 0);
            }

            // 2. Update Posisi Panner (Monster)
            if (threatPanner.positionX) {
              threatPanner.positionX.setTargetAtTime(this.threatPos.x, audioCtx.currentTime, 0.05);
              threatPanner.positionY.setTargetAtTime(this.threatPos.y, audioCtx.currentTime, 0.05);
              threatPanner.positionZ.setTargetAtTime(this.threatPos.z, audioCtx.currentTime, 0.05);
            } else {
              threatPanner.setPosition(this.threatPos.x, this.threatPos.y, this.threatPos.z);
            }
          }

          // Timer Lengkingan
          this.screechTimer -= timeDelta;
          if (this.screechTimer <= 0) {
            playScreech(); // Tidak butuh parameter volume, jaraknya sekarang 100% fisika 3D
            this.screechTimer = 1500 + (Math.random() * 2000); 
          }
        }
      });
    </script>
  </head>
  <body>
    
    <div id="instruction">USE HEADPHONES 🎧<br><br>TAP THE FLOOR TO RUN.<br>TRUST YOUR EARS.</div>

    <div id="death-overlay">
      <h1 id="death-text">YOU DIED</h1>
    </div>

    <a-scene fog="type: exponential; color: #040909; density: 0.07" background="color: #040909">

      <a-entity id="cameraRig" position="0 0 0" player-movement>
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          
          <a-entity cursor="rayOrigin: mouse;"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #ffffff; shader: flat; opacity: 0.4">
          </a-entity>
          
        </a-camera>
      </a-entity>

      <a-entity id="threatEntity" visible="false" threat-system>
        <a-sphere radius="0.4" position="0 1.5 0" color="#ff0000" material="shader: flat; transparent: true; opacity: 0.8" 
                  animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; dur: 300; loop: true"></a-sphere>
        <a-sphere radius="1.2" position="0 1.2 0" color="#000000" material="shader: flat; transparent: true; opacity: 0.95"></a-sphere>
        <a-sphere radius="1.5" position="0.2 0.8 -0.2" color="#050505" material="shader: flat; transparent: true; opacity: 0.6"></a-sphere>
        <a-box width="3" height="0.1" depth="0.5" position="0 1.2 0.5" color="#000000" material="shader: flat; transparent: true; opacity: 0.9"></a-box>
      </a-entity>

      <a-light type="ambient" color="#101818"></a-light>
      <a-light type="point" color="#88cccc" intensity="0.3" position="0 15 0" distance="50"></a-light>

      <a-plane class="walkable" endless-ground rotation="-90 0 0" width="200" height="200" color="#020404" material="shader: flat"></a-plane>
      
      <a-entity endless-scenery="itemsCount: 300; radius: 50"></a-entity>

    </a-scene>
  </body>
</html>
