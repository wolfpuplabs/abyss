<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Endless VR Limbo - Flitting Dementor</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
      #ui-container {
        position: absolute;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
      }
      #scareToggle {
        background: rgba(10, 10, 10, 0.8);
        border: 2px solid #555;
        border-radius: 50%;
        width: 55px;
        height: 55px;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
      }
      #scareToggle.active {
        border-color: #ff0000;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
        background: rgba(40, 0, 0, 0.8);
      }
    </style>

    <script>
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      let bgmStarted = false;

      // BGM BISIKAN
      function startWhisperBGM() {
        if (bgmStarted) return;
        bgmStarted = true;

        const bufferSize = audioCtx.sampleRate * 2; 
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1000; 
        filter.Q.value = 1.0;

        const lfo = audioCtx.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 1.5; 
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 600; 
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);

        const whisperGain = audioCtx.createGain();
        whisperGain.gain.value = 0.15; 

        const drone = audioCtx.createOscillator();
        drone.type = 'triangle';
        drone.frequency.value = 45; 
        const droneGain = audioCtx.createGain();
        droneGain.gain.value = 0.08; 

        whiteNoise.connect(filter);
        filter.connect(whisperGain);
        whisperGain.connect(audioCtx.destination);
        
        drone.connect(droneGain);
        droneGain.connect(audioCtx.destination);

        whiteNoise.start(); lfo.start(); drone.start();
      }

      function unlockAudio() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        if (source.start) source.start(0); else source.noteOn(0);

        startWhisperBGM();

        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('click', unlockAudio);
      }
      window.addEventListener('touchstart', unlockAudio, false);
      window.addEventListener('click', unlockAudio, false);

      // Tap to Move
      AFRAME.registerComponent('tap-to-move', {
        init: function () {
          var rig = document.querySelector('#cameraRig');
          this.el.addEventListener('click', function (evt) {
            var point = evt.detail.intersection.point;
            rig.setAttribute('animation', {
              property: 'position',
              to: point.x + ' 0 ' + point.z,
              dur: 1500,
              easing: 'easeOutCubic'
            });
          });
        }
      });

      // Endless Ground
      AFRAME.registerComponent('endless-ground', {
        tick: function () {
          var camPos = document.querySelector('#cameraRig').object3D.position;
          this.el.object3D.position.set(camPos.x, 0, camPos.z);
        }
      });

      // Endless Forest
      AFRAME.registerComponent('endless-forest', {
        schema: { treeCount: {type: 'int', default: 200}, radius: {type: 'number', default: 50} },
        init: function () {
          this.trees = [];
          this.cameraRig = document.querySelector('#cameraRig');
          for (let i = 0; i < this.data.treeCount; i++) {
            let tree = document.createElement('a-cylinder');
            tree.setAttribute('color', '#000000');
            tree.setAttribute('material', 'shader: flat; roughness: 1');
            let radius = Math.random() * 0.5 + 0.1;
            let height = Math.random() * 20 + 10;
            tree.setAttribute('radius', radius);
            tree.setAttribute('height', height);
            this.repositionTree(tree, true);
            this.el.appendChild(tree);
            this.trees.push({el: tree, height: height});
          }
        },
        tick: function () {
          let camPos = this.cameraRig.object3D.position;
          for (let treeObj of this.trees) {
            let treePos = treeObj.el.object3D.position;
            let dx = treePos.x - camPos.x;
            let dz = treePos.z - camPos.z;
            if (Math.sqrt(dx*dx + dz*dz) > this.data.radius) {
              this.repositionTree(treeObj.el, false);
            }
          }
        },
        repositionTree: function (tree, isInit) {
          let camPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = isInit ? Math.random() * this.data.radius : this.data.radius - 2;
          if (isInit && dist < 4) dist += 5;
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          tree.object3D.position.set(tx, tree.getAttribute('height') / 2, tz);
        }
      });

      // Sistem Jump Scare (Berkelebat)
      document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('scareToggle');
        const scareEntity = document.getElementById('scareEntity');
        
        let scareActive = true; 
        let scareTimer = null;

        // Suara berkelebat cepat (swoosh)
        function playDartSound() {
          if (audioCtx.state !== 'running') return;
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
          gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(1, audioCtx.currentTime + 0.1);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        // Suara serangan utama
        function playAttackSound() {
          if (audioCtx.state !== 'running') return; 
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(90, audioCtx.currentTime);
          osc1.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.6);
          osc2.type = 'sawtooth';
          osc2.frequency.setValueAtTime(200, audioCtx.currentTime);
          osc2.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.6);
          gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(6, audioCtx.currentTime + 0.5);
          gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.0);
          osc1.connect(gainNode); osc2.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          osc1.start(); osc2.start();
          osc1.stop(audioCtx.currentTime + 1.1); osc2.stop(audioCtx.currentTime + 1.1);
        }

        function triggerScare() {
          if (!scareActive) return;
          
          scareEntity.setAttribute('scale', '1 1 1');
          scareEntity.setAttribute('visible', 'true');
          
          // FASE 1: Muncul di Kiri Jauh
          scareEntity.setAttribute('position', '-5 1.5 -10');
          playDartSound();
          
          setTimeout(() => {
            // FASE 2: Berpindah ke Kanan Jauh
            scareEntity.setAttribute('position', '5 2.5 -8');
            playDartSound();
            
            setTimeout(() => {
              // FASE 3: Muncul di Tengah dan Serang (Dash)
              scareEntity.setAttribute('position', '0 1.5 -12');
              playAttackSound();
              
              // Melesat cepat dalam 500ms
              scareEntity.setAttribute('animation__dash', {
                property: 'position',
                to: '0 1 -0.2',
                dur: 500,
                easing: 'easeInCubic'
              });

              // Membesar menelan kamera
              scareEntity.setAttribute('animation__scale', {
                property: 'scale',
                to: '5 5 5',
                dur: 500,
                easing: 'easeInQuad'
              });

              setTimeout(() => {
                scareEntity.setAttribute('visible', 'false');
                scareEntity.removeAttribute('animation__dash');
                scareEntity.removeAttribute('animation__scale');
                scheduleNextScare();
              }, 600); 

            }, 400); // Jeda sebelum serangan utama
          }, 400); // Jeda berkelebat
        }

        function scheduleNextScare() {
          if (!scareActive) return;
          const nextScareTime = Math.random() * 15000 + 10000; 
          scareTimer = setTimeout(triggerScare, nextScareTime);
        }

        scheduleNextScare();

        toggleBtn.addEventListener('click', () => {
          scareActive = !scareActive;
          if (scareActive) {
            toggleBtn.classList.add('active');
            toggleBtn.innerHTML = '👁️'; 
            scheduleNextScare();
          } else {
            toggleBtn.classList.remove('active');
            toggleBtn.innerHTML = '🔕'; 
            clearTimeout(scareTimer);
            scareEntity.setAttribute('visible', 'false');
          }
        });
      });
    </script>
  </head>
  <body>
    
    <div id="ui-container">
      <button id="scareToggle" class="active" title="Toggle Scare">👁️</button>
    </div>

    <!-- Kabut Limbo -->
    <a-scene fog="type: exponential; color: #0c0c0c; density: 0.06" background="color: #0c0c0c">

      <a-entity id="cameraRig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          
          <a-entity cursor="rayOrigin: mouse;"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #ffffff; shader: flat; opacity: 0.5">
          </a-entity>
          
          <!-- MODEL DEMENTOR DENGAN AURA AGAR TERLIHAT -->
          <a-entity id="scareEntity" visible="false" position="0 1.5 -12">
            <!-- Aura pucat (Glow samar) di belakang tubuh -->
            <a-sphere radius="1.2" position="0 1.5 -0.2" color="#ffffff" material="shader: flat; transparent: true; opacity: 0.08"></a-sphere>
            
            <!-- Jubah Inti -->
            <a-cone radius-bottom="0.8" radius-top="0.2" height="3" color="#000000" material="shader: flat; transparent: true; opacity: 0.95"></a-cone>
            <!-- Kepala -->
            <a-sphere radius="0.35" position="0 1.5 0.1" color="#000000" material="shader: flat"></a-sphere>
            <!-- Jubah Berkibar Belakang -->
            <a-cylinder radius="0.7" height="2" position="0 0.5 0.2" rotation="-20 0 0" color="#050505" material="shader: flat; transparent: true; opacity: 0.8"></a-cylinder>
            <!-- Lengan Menjulur -->
            <a-box width="2.5" height="0.2" depth="1" position="0 0.5 0.3" rotation="10 0 0" color="#000000" material="shader: flat; transparent: true; opacity: 0.9"></a-box>
          </a-entity>

        </a-camera>
      </a-entity>

      <a-light type="ambient" color="#111"></a-light>
      <a-light type="point" color="#ffffff" intensity="0.6" position="0 15 0" distance="50"></a-light>

      <a-plane class="walkable" tap-to-move endless-ground rotation="-90 0 0" width="200" height="200" color="#050505" material="shader: flat"></a-plane>
      
      <a-entity endless-forest="treeCount: 200; radius: 50"></a-entity>

    </a-scene>
  </body>
</html>
