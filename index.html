<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Endless VR Limbo - Sudden Death & Footsteps</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
      body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
      
      /* UI Overlay Darah Kematian */
      #death-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999;
        pointer-events: none;
        background: 
          radial-gradient(circle at 30% 40%, #600000 0%, transparent 15%),
          radial-gradient(circle at 70% 60%, #800000 0%, transparent 20%),
          radial-gradient(circle at 50% 80%, #500000 0%, transparent 10%),
          radial-gradient(circle, transparent 20%, rgba(60, 0, 0, 0.8) 70%, #0a0000 100%);
        background-color: rgba(20, 0, 0, 0.6);
        animation: fadeInBlood 0.3s ease-out forwards;
      }
      
      @keyframes fadeInBlood {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      #death-text {
        position: absolute;
        top: 50%; width: 100%;
        transform: translateY(-50%);
        text-align: center;
        color: #ff0000;
        font-family: 'Courier New', Courier, monospace;
        font-size: 12vw;
        font-weight: bold;
        margin: 0;
        text-shadow: 2px 2px 10px #000, 0 0 30px #880000;
      }
      
      #instruction {
        position: absolute;
        top: 20px; width: 100%;
        text-align: center;
        color: #fff;
        font-family: monospace;
        font-size: 16px;
        z-index: 9998;
        pointer-events: none;
        text-shadow: 0 0 5px #000;
        transition: opacity 1s;
      }
    </style>

    <script>
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      
      window.isGameOver = false;
      window.gameStarted = false;

      // -- SISTEM SFX (FOOTSTEP & MONSTER) -- //
      
      // Suara langkah kaki di daun kering (White Noise + Bandpass Filter)
      function playFootstep() {
        if (audioCtx.state !== 'running') return;
        const bufferSize = audioCtx.sampleRate * 0.1; // Durasi 100ms
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        // Bikin suara berisik (kresek)
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1200; // Frekuensi daun kering

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start();
      }

      // Suara Lengkingan Monster
      function playScreech(volumeMult) {
        if (audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(2800, audioCtx.currentTime + 0.3);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.6);
        
        let finalVol = Math.max(0.01, volumeMult * 3); 
        
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(finalVol, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); 
        osc.stop(audioCtx.currentTime + 1);
      }

      function playDeathSound() {
        if (audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
        
        gain.gain.setValueAtTime(4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); 
        osc.stop(audioCtx.currentTime + 2);
      }

      // -- UNLOCK AUDIO PADA SENTUHAN PERTAMA -- //
      function unlockAudio() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const buffer = audioCtx.createBuffer(1, 1, 22050);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer; source.connect(audioCtx.destination);
        if (source.start) source.start(0); else source.noteOn(0);
        
        window.removeEventListener('touchstart', unlockAudio);
        window.removeEventListener('mousedown', unlockAudio);
      }
      window.addEventListener('touchstart', unlockAudio, false);
      window.addEventListener('mousedown', unlockAudio, false);


      // -- SISTEM JALAN MULUS (TIDAK TELEPORT) & FOOTSTEP -- //
      AFRAME.registerComponent('player-movement', {
        init: function () {
          this.targetPos = null;
          this.speed = 4.5; // Kecepatan jalan player (m/s)
          this.nextStepTime = 0;
          this.rig = document.querySelector('#cameraRig');

          let walkable = document.querySelector('.walkable');
          walkable.addEventListener('click', (evt) => {
            if (window.isGameOver) return;
            
            // Set target tujuan jalan
            this.targetPos = evt.detail.intersection.point;
            
            // Mulai game / panggil monster pada tap pertama
            if (!window.gameStarted) {
              window.gameStarted = true;
              document.getElementById('instruction').style.opacity = '0';
              document.querySelector('#threatEntity').components['threat-system'].startChase();
            }
          });
        },
        tick: function (time, timeDelta) {
          if (window.isGameOver || !this.targetPos) return;

          let currentPos = this.rig.object3D.position;
          let dist = currentPos.distanceTo(this.targetPos);

          // Jika belum sampai di tujuan
          if (dist > 0.1) {
            // Kalkulasi arah
            let dir = this.targetPos.clone().sub(currentPos).normalize();
            dir.y = 0; // Kunci di tanah
            
            let moveDist = this.speed * (timeDelta / 1000);
            if (moveDist > dist) moveDist = dist; // Cegah kebablasan
            
            // Bergerak perlahan
            currentPos.addScaledVector(dir, moveDist);

            // Putar SFX daun kering secara ritmis
            if (time > this.nextStepTime) {
              playFootstep();
              this.nextStepTime = time + 350; // Jarak antar langkah (ms)
            }
          }
        }
      });

      // -- SISTEM GENERATOR HUTAN & SEMAK (BUSHES) -- //
      AFRAME.registerComponent('endless-scenery', {
        schema: { itemsCount: {type: 'int', default: 300}, radius: {type: 'number', default: 50} },
        init: function () {
          this.items = [];
          this.cameraRig = document.querySelector('#cameraRig');
          
          // Generate 150 Pohon
          for (let i = 0; i < this.data.itemsCount / 2; i++) {
            let tree = document.createElement('a-cylinder');
            tree.setAttribute('color', '#010202');
            tree.setAttribute('material', 'shader: flat');
            let radius = Math.random() * 0.4 + 0.1;
            let height = Math.random() * 20 + 10;
            tree.setAttribute('radius', radius);
            tree.setAttribute('height', height);
            this.repositionItem(tree, true, height / 2);
            this.el.appendChild(tree);
            this.items.push({el: tree, yOffset: height / 2});
          }

          // Generate 150 Semak (Bushes)
          for (let i = 0; i < this.data.itemsCount / 2; i++) {
            let bush = document.createElement('a-sphere');
            bush.setAttribute('color', '#000000');
            bush.setAttribute('material', 'shader: flat');
            let radius = Math.random() * 1.5 + 0.5;
            bush.setAttribute('radius', radius);
            // Gepengkan sphere untuk bentuk semak
            bush.setAttribute('scale', '1 0.6 1'); 
            this.repositionItem(bush, true, radius * 0.4);
            this.el.appendChild(bush);
            this.items.push({el: bush, yOffset: radius * 0.4});
          }
        },
        tick: function () {
          let camPos = this.cameraRig.object3D.position;
          for (let obj of this.items) {
            let itemPos = obj.el.object3D.position;
            let dx = itemPos.x - camPos.x;
            let dz = itemPos.z - camPos.z;
            if (Math.sqrt(dx*dx + dz*dz) > this.data.radius) {
              this.repositionItem(obj.el, false, obj.yOffset);
            }
          }
        },
        repositionItem: function (el, isInit, yOff) {
          let camPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = isInit ? Math.random() * this.data.radius : this.data.radius - 2;
          if (isInit && dist < 3) dist += 5; // Jangan spawn numpuk di player saat awal
          
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          el.object3D.position.set(tx, yOff, tz);
        }
      });

      AFRAME.registerComponent('endless-ground', {
        tick: function () {
          var camPos = document.querySelector('#cameraRig').object3D.position;
          this.el.object3D.position.set(camPos.x, 0, camPos.z);
        }
      });

      // -- SISTEM SUDDEN DEATH PENGEJAR -- //
      AFRAME.registerComponent('threat-system', {
        init: function () {
          this.cameraRig = document.querySelector('#cameraRig');
          this.active = false;
          this.speed = 4.2; // Sedikit lebih lambat dari player (4.5) agar bisa kabur
          this.screechTimer = 0;
          this.threatPos = new THREE.Vector3();
        },
        startChase: function () {
          this.active = true;
          window.isGameOver = false;
          
          // Spawn di belakang player jarak 25 meter
          let rigPos = this.cameraRig.object3D.position;
          this.threatPos.set(rigPos.x, 1.5, rigPos.z + 25);
          
          this.el.object3D.position.copy(this.threatPos);
          this.el.setAttribute('visible', 'true');
        },
        triggerDeath: function () {
          window.isGameOver = true;
          this.active = false;
          
          // Kematian Instan
          let rigPos = this.cameraRig.object3D.position;
          this.el.object3D.position.set(rigPos.x, rigPos.y + 1.5, rigPos.z - 1.5);
          
          document.getElementById('death-overlay').style.display = 'block';
          playDeathSound();
        },
        tick: function (time, timeDelta) {
          if (!this.active || window.isGameOver) return;

          let rigPos = this.cameraRig.object3D.position;
          let distToPlayer = this.threatPos.distanceTo(rigPos);

          // Jarak kematian
          if (distToPlayer < 3.5) {
            this.triggerDeath();
            return;
          }

          // Bergerak mengejar
          let dir = new THREE.Vector3().subVectors(rigPos, this.threatPos).normalize();
          dir.y = 0; 
          let moveDist = this.speed * (timeDelta / 1000);
          this.threatPos.addScaledVector(dir, moveDist);
          this.el.object3D.position.copy(this.threatPos);
          this.el.object3D.lookAt(rigPos); 

          // Lengkingan random
          this.screechTimer -= timeDelta;
          if (this.screechTimer <= 0) {
            let vol = Math.max(0, 1.0 - (distToPlayer / 40));
            playScreech(vol);
            this.screechTimer = 2000 + (Math.random() * 2000); // Tiap 2-4 detik
          }
        }
      });
    </script>
  </head>
  <body>
    
    <div id="instruction">TAP THE FLOOR TO RUN. DON'T LOOK BACK.</div>

    <div id="death-overlay">
      <h1 id="death-text">YOU DIED</h1>
    </div>

    <a-scene fog="type: exponential; color: #040909; density: 0.07" background="color: #040909">

      <a-entity id="cameraRig" position="0 0 0" player-movement>
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          
          <a-entity cursor="rayOrigin: mouse;"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #ffffff; shader: flat; opacity: 0.4">
          </a-entity>
          
        </a-camera>
      </a-entity>

      <a-entity id="threatEntity" visible="false" threat-system>
        <a-sphere radius="0.4" position="0 1.5 0" color="#ff0000" material="shader: flat; transparent: true; opacity: 0.8" 
                  animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; dur: 300; loop: true"></a-sphere>
        <a-sphere radius="1.2" position="0 1.2 0" color="#000000" material="shader: flat; transparent: true; opacity: 0.95"></a-sphere>
        <a-sphere radius="1.5" position="0.2 0.8 -0.2" color="#050505" material="shader: flat; transparent: true; opacity: 0.6"></a-sphere>
        <a-box width="3" height="0.1" depth="0.5" position="0 1.2 0.5" color="#000000" material="shader: flat; transparent: true; opacity: 0.9"></a-box>
      </a-entity>

      <a-light type="ambient" color="#101818"></a-light>
      <a-light type="point" color="#88cccc" intensity="0.3" position="0 15 0" distance="50"></a-light>

      <a-plane class="walkable" endless-ground rotation="-90 0 0" width="200" height="200" color="#020404" material="shader: flat"></a-plane>
      
      <a-entity endless-scenery="itemsCount: 300; radius: 50"></a-entity>

    </a-scene>
  </body>
</html>
