<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Endless VR Limbo Forest - Tap to Move</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <script>
      // 1. Sistem Tap to Move
      AFRAME.registerComponent('tap-to-move', {
        init: function () {
          var rig = document.querySelector('#cameraRig');
          this.el.addEventListener('click', function (evt) {
            var point = evt.detail.intersection.point;
            
            rig.setAttribute('animation', {
              property: 'position',
              to: point.x + ' 0 ' + point.z,
              dur: 1500,
              easing: 'easeOutCubic'
            });
          });
        }
      });

      // 2. Sistem Endless Ground (Lantai mengikuti pemain agar tidak pernah habis)
      AFRAME.registerComponent('endless-ground', {
        tick: function () {
          var camPos = document.querySelector('#cameraRig').object3D.position;
          // Pindahkan lantai ke posisi X dan Z kamera (warna solid membuat pergerakan ini tidak terlihat)
          this.el.object3D.position.set(camPos.x, 0, camPos.z);
        }
      });

      // 3. Sistem Endless Forest (Procedural / Object Pooling Batang Pohon)
      AFRAME.registerComponent('endless-forest', {
        schema: {
          treeCount: {type: 'int', default: 200}, // Jumlah pohon render maksimal
          radius: {type: 'number', default: 45}   // Jarak pandang kabut/pohon
        },
        init: function () {
          this.trees = [];
          this.cameraRig = document.querySelector('#cameraRig');
          
          // Generate batch pohon awal
          for (let i = 0; i < this.data.treeCount; i++) {
            let tree = document.createElement('a-cylinder');
            
            // Gaya Limbo: Hitam pekat, flat shader
            tree.setAttribute('color', '#000000');
            tree.setAttribute('material', 'shader: flat; roughness: 1');
            
            // Randomisasi ukuran batang
            let radius = Math.random() * 0.5 + 0.1;
            let height = Math.random() * 20 + 10;
            tree.setAttribute('radius', radius);
            tree.setAttribute('height', height);
            
            this.repositionTree(tree, true);
            this.el.appendChild(tree);
            this.trees.push({el: tree, height: height});
          }
        },
        tick: function () {
          let camPos = this.cameraRig.object3D.position;
          
          // Cek setiap frame: Jika pohon terlalu jauh ditinggalkan, pindahkan ke depan/area sekitar
          for (let treeObj of this.trees) {
            let treePos = treeObj.el.object3D.position;
            let dx = treePos.x - camPos.x;
            let dz = treePos.z - camPos.z;
            let distance = Math.sqrt(dx*dx + dz*dz);
            
            if (distance > this.data.radius) {
              this.repositionTree(treeObj.el, false);
            }
          }
        },
        repositionTree: function (tree, isInit) {
          let camPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          
          // Jika baru mulai, sebar di mana saja. Jika sedang berjalan, spawn di ujung batas radius
          let dist = isInit ? Math.random() * this.data.radius : this.data.radius - 2;
          
          // Hindari pohon spawn terlalu dekat (menimpa pemain) saat awal
          if (isInit && dist < 4) dist += 5;
          
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          let height = tree.getAttribute('height');
          
          tree.object3D.position.set(tx, height / 2, tz);
        }
      });
    </script>
  </head>
  <body>
    <!-- Environment Limbo: Warna dasar gelap dengan kabut tebal -->
    <a-scene fog="type: exponential; color: #0a0a0a; density: 0.08" background="color: #0a0a0a">

      <!-- Kamera & Cursor -->
      <a-entity id="cameraRig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          
          <!-- Cursor untuk Tap/Klik -->
          <a-entity cursor="rayOrigin: mouse;"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #ffffff; shader: flat; opacity: 0.5">
          </a-entity>
          
          <!-- Cursor Gaze (untuk mode VR Cardboard/Headset) -->
          <a-entity cursor="fuse: true; fuseTimeout: 1200"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
                    material="color: #ffffff; shader: flat; opacity: 0.3"
                    animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.1 0.1 0.1; to: 1 1 1"
                    animation__fusing="property: scale; startEvents: fusing; easing: easeInCubic; dur: 1200; from: 1 1 1; to: 0.1 0.1 0.1">
          </a-entity>
        </a-camera>
      </a-entity>

      <!-- Pencahayaan Kontras -->
      <a-light type="ambient" color="#111"></a-light>
      <a-light type="point" color="#ffffff" intensity="0.6" position="0 15 0" distance="50"></a-light>

      <!-- Lantai Endless -->
      <a-plane class="walkable" 
               tap-to-move endless-ground
               rotation="-90 0 0" 
               width="200" height="200" 
               color="#050505" 
               material="shader: flat"></a-plane>

      <!-- Entitas generator hutan endless -->
      <a-entity endless-forest="treeCount: 250; radius: 50"></a-entity>

      <!-- Partikel putih melayang (Aksen visual) -->
      <a-entity position="0 0 0">
        <a-sphere position="-2 3 -5" radius="0.1" color="#fff" material="shader: flat" animation="property: position; to: -2 4 -5; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"></a-sphere>
        <a-sphere position="4 2 -8" radius="0.05" color="#fff" material="shader: flat" animation="property: position; to: 4 2.5 -8; dir: alternate; dur: 3500; loop: true; easing: easeInOutSine"></a-sphere>
        <a-sphere position="1 4 -12" radius="0.15" color="#fff" material="shader: flat" animation="property: position; to: 1 5 -12; dir: alternate; dur: 4000; loop: true; easing: easeInOutSine"></a-sphere>
      </a-entity>

    </a-scene>
  </body>
</html>
