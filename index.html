<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A Last Roban</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
      body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
      
      /* UI Start Menu */
      #start-menu {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }

      #start-menu-box {
        background: rgba(15, 25, 25, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 40px 60px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        backdrop-filter: blur(4px);
      }

      #start-menu-box h1 {
        color: #ff4444;
        font-family: 'Courier New', monospace;
        font-size: 32px;
        margin-top: 0;
        margin-bottom: 25px;
        text-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        letter-spacing: 2px;
      }

      #start-menu-box p {
        color: #fff;
        font-family: monospace;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 40px;
      }

      .btn-glow {
        background: transparent;
        color: white;
        border: 2px solid #ff0000;
        border-radius: 4px;
        padding: 12px 35px;
        font-size: 18px;
        font-weight: bold;
        font-family: monospace;
        cursor: pointer;
        text-transform: uppercase;
        box-shadow: 0 0 15px rgba(255, 0, 0, 0.5), inset 0 0 10px rgba(255, 0, 0, 0.3);
        transition: 0.3s;
      }
      .btn-glow:hover { 
        background: rgba(255, 0, 0, 0.15); 
        box-shadow: 0 0 25px rgba(255, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.6);
      }

      /* HUD Progress Bar (Bulan ke Matahari) */
      #hud-daynight-container {
        display: none;
        position: absolute;
        top: 25px; left: 50%;
        transform: translateX(-50%);
        width: 340px;
        background: rgba(10, 15, 20, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 30px;
        padding: 8px 18px;
        z-index: 9998;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(3px);
      }

      .dn-icon {
        font-size: 22px;
        user-select: none;
      }

      #sun-moon-bar {
        flex-grow: 1;
        height: 12px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      #sun-moon-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3b5998, #f8b500, #ff7e5f);
        border-radius: 6px;
        transition: width 0.1s linear;
        box-shadow: 0 0 8px rgba(255, 180, 80, 0.6);
      }

      #hud-timer-text {
        color: #eee;
        font-family: monospace;
        font-size: 13px;
        min-width: 40px;
        text-align: right;
        text-shadow: 0 0 5px #000;
      }

      /* Black Fade Overlay untuk Transisi */
      #fade-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000;
        z-index: 10000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
      }

      /* UI Checkpoint Video */
      #checkpoint-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #000;
        z-index: 10001;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #checkpoint-overlay h2 {
        color: #ffaa44;
        font-family: 'Courier New', monospace;
        text-shadow: 0 0 15px #ff6600;
        margin-bottom: 20px;
        letter-spacing: 3px;
      }

      #cp-video {
        border: 2px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 40px rgba(255, 100, 0, 0.3);
        max-width: 80%;
        max-height: 60%;
        border-radius: 8px;
        margin-bottom: 25px;
      }

      /* Layar Sudden Death */
      #death-overlay {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: 
          radial-gradient(circle at 30% 40%, #600000 0%, transparent 15%),
          radial-gradient(circle at 70% 60%, #800000 0%, transparent 20%),
          radial-gradient(circle at 50% 80%, #500000 0%, transparent 10%),
          radial-gradient(circle, transparent 20%, rgba(60, 0, 0, 0.8) 70%, #0a0000 100%);
        background-color: rgba(20, 0, 0, 0.6);
        animation: fadeInBlood 0.5s ease-out forwards;
      }
      
      @keyframes fadeInBlood {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }

      #death-text {
        color: #ff0000;
        font-family: 'Courier New', Courier, monospace;
        font-size: 10vw;
        font-weight: bold;
        margin: 0;
        text-shadow: 2px 2px 10px #000, 0 0 30px #880000;
      }

      #final-time {
        color: #fff;
        font-family: monospace;
        font-size: 2vw;
        margin-top: 10px;
        margin-bottom: 40px;
        text-shadow: 2px 2px 5px #000;
      }
    </style>

    <script>
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioContext();
      
      // BGM Ambience
      function playBGM() {
        if(window.bgmOsc) return;
        const bufferSize = audioCtx.sampleRate * 2; 
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) { output[i] = Math.random() * 2 - 1; }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400; 

        const whisperGain = audioCtx.createGain();
        whisperGain.gain.value = 0.2; 

        whiteNoise.connect(filter);
        filter.connect(whisperGain);
        whisperGain.connect(audioCtx.destination);
        whiteNoise.start(); 
        window.bgmOsc = whiteNoise;
      }

      // Suara Lengkingan
      function playScreech(volumeMult) {
        if (audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(2500, audioCtx.currentTime + 0.3);
        osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.6);
        let finalVol = Math.max(0.01, volumeMult * 4); 
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(finalVol, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); 
        osc.stop(audioCtx.currentTime + 1);
      }

      // Suara Kematian
      function playDeathSound() {
        if (audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(); 
        osc.stop(audioCtx.currentTime + 2);
      }

      // Fungsi Pembantu Interpolasi Warna (Lerp Color)
      function lerpColor(c1, c2, factor) {
        let r1 = parseInt(c1.substring(1,3), 16), g1 = parseInt(c1.substring(3,5), 16), b1 = parseInt(c1.substring(5,7), 16);
        let r2 = parseInt(c2.substring(1,3), 16), g2 = parseInt(c2.substring(3,5), 16), b2 = parseInt(c2.substring(5,7), 16);
        let r = Math.round(r1 + factor * (r2 - r1));
        let g = Math.round(g1 + factor * (g2 - g1));
        let b = Math.round(b1 + factor * (b2 - b1));
        return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
      }


      // -- SISTEM KONTROL & GAMEPLAY -- //
      window.isGameOver = true; 
      window.isCheckpoint = false;
      window.gameTime = 0;
      window.nextCheckpoint = 120; // Checkpoint di 120 detik

      AFRAME.registerComponent('tap-to-move', {
        init: function () {
          this.rig = document.querySelector('#cameraRig');
          this.el.addEventListener('click', (evt) => {
            if (window.isGameOver || window.isCheckpoint) return; 
            
            var point = evt.detail.intersection.point;
            this.rig.setAttribute('animation', {
              property: 'position',
              to: point.x + ' 0 ' + point.z,
              dur: 1000, 
              easing: 'linear'
            });
          });
        }
      });

      AFRAME.registerComponent('endless-ground', {
        tick: function () {
          var camPos = document.querySelector('#cameraRig').object3D.position;
          this.el.object3D.position.set(camPos.x, 0, camPos.z);
        }
      });

      AFRAME.registerComponent('endless-forest', {
        schema: { treeCount: {type: 'int', default: 200}, radius: {type: 'number', default: 50} },
        init: function () {
          this.trees = [];
          this.cameraRig = document.querySelector('#cameraRig');
          for (let i = 0; i < this.data.treeCount; i++) {
            let tree = document.createElement('a-cylinder');
            tree.setAttribute('color', '#020505');
            tree.setAttribute('material', 'shader: flat; roughness: 1');
            let radius = Math.random() * 0.4 + 0.1;
            let height = Math.random() * 20 + 10;
            tree.setAttribute('radius', radius);
            tree.setAttribute('height', height);
            this.repositionTree(tree, true);
            this.el.appendChild(tree);
            this.trees.push({el: tree, height: height});
          }
        },
        tick: function () {
          let camPos = this.cameraRig.object3D.position;
          for (let treeObj of this.trees) {
            let treePos = treeObj.el.object3D.position;
            let dx = treePos.x - camPos.x;
            let dz = treePos.z - camPos.z;
            if (Math.sqrt(dx*dx + dz*dz) > this.data.radius) {
              this.repositionTree(treeObj.el, false);
            }
          }
        },
        repositionTree: function (tree, isInit) {
          let camPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = isInit ? Math.random() * this.data.radius : this.data.radius - 2;
          if (isInit && dist < 4) dist += 5;
          let tx = camPos.x + Math.cos(angle) * dist;
          let tz = camPos.z + Math.sin(angle) * dist;
          tree.object3D.position.set(tx, tree.getAttribute('height') / 2, tz);
        }
      });

      // -- SISTEM DEMENTOR & CHECKPOINT -- //
      AFRAME.registerComponent('threat-system', {
        init: function () {
          this.cameraRig = document.querySelector('#cameraRig');
          this.active = false;
          this.baseSpeed = 4.5;
          this.speed = this.baseSpeed; 
          this.screechTimer = 0;
          this.threatPos = new THREE.Vector3();
        },
        startGame: function () {
          this.active = true;
          window.isGameOver = false;
          window.isCheckpoint = false;
          
          document.getElementById('hud-daynight-container').style.display = 'flex';

          // Spawn Dementor lebih tinggi di udara (ketinggian Y = 4.5)
          let rigPos = this.cameraRig.object3D.position;
          let angle = Math.random() * Math.PI * 2;
          let dist = 25;
          
          this.threatPos.set(
            rigPos.x + Math.cos(angle) * dist,
            4.5, 
            rigPos.z + Math.sin(angle) * dist
          );
          
          this.el.object3D.position.copy(this.threatPos);
          this.el.setAttribute('visible', 'true');
        },
        triggerCheckpoint: function() {
          window.isCheckpoint = true;
          this.active = false; 

          this.cameraRig.removeAttribute('animation');

          // Efek Fade Out Layar (Menggelap)
          const fade = document.getElementById('fade-overlay');
          fade.style.opacity = '1';

          setTimeout(() => {
            // Tampilkan Overlay Video
            const cpOverlay = document.getElementById('checkpoint-overlay');
            const cpVideo = document.getElementById('cp-video');
            cpOverlay.style.display = 'flex';
            
            cpVideo.currentTime = 0;
            let playPromise = cpVideo.play();
            if (playPromise !== undefined) {
              playPromise.catch(error => {
                console.log("Video auto-play interrupted:", error);
              });
            }
            
            // Fade In kembali
            fade.style.opacity = '0';
          }, 1000);
          
          this.speed += 0.5; 
        },
        resumeFromCheckpoint: function() {
          const fade = document.getElementById('fade-overlay');
          fade.style.opacity = '1';

          setTimeout(() => {
            document.getElementById('checkpoint-overlay').style.display = 'none';
            const cpVideo = document.getElementById('cp-video');
            cpVideo.pause();

            window.isCheckpoint = false;
            this.active = true;
            
            // Jauhkan dementor saat resume
            let rigPos = this.cameraRig.object3D.position;
            let dir = new THREE.Vector3().subVectors(this.threatPos, rigPos).normalize();
            this.threatPos.addScaledVector(dir, 12); 
            
            fade.style.opacity = '0';
          }, 1000);
        },
        triggerDeath: function () {
          window.isGameOver = true;
          this.active = false;
          
          // Letakkan Dementor terbang tinggi di depan mata saat mati
          let rigPos = this.cameraRig.object3D.position;
          this.el.object3D.position.set(rigPos.x, rigPos.y + 2.5, rigPos.z - 3.0);
          this.el.object3D.lookAt(rigPos);

          this.cameraRig.removeAttribute('animation');
          
          document.getElementById('final-time-val').innerText = window.gameTime.toFixed(1);
          document.getElementById('death-overlay').style.display = 'flex';
          
          playDeathSound();
        },
        tick: function (time, timeDelta) {
          if (!window.isGameOver && !window.isCheckpoint) {
            window.gameTime += (timeDelta / 1000);

            // Calculation Progress (0.0 ke 1.0) selama 120 detik
            let currentCycleTime = window.gameTime % 120;
            let progress = currentCycleTime / 120;

            // Update Progress Bar & Timer Text
            document.getElementById('sun-moon-fill').style.width = (progress * 100) + '%';
            document.getElementById('hud-timer-text').innerText = (120 - currentCycleTime).toFixed(0) + 's';

            // --- PERUBAHAN PENCAHAYAAN DINAMIS (MALAM KE SUBUH) ---
            let ambColor = lerpColor("#1a2525", "#664433", progress);
            let ambIntensity = 0.2 + (progress * 0.5); // 0.2 -> 0.7
            let sunColor = lerpColor("#334466", "#ffaa66", progress);
            let sunIntensity = 0.3 + (progress * 0.7); // 0.3 -> 1.0
            let fogColor = lerpColor("#071313", "#3d2b28", progress);
            let bgColor = lerpColor("#071313", "#2a1e24", progress);

            let ambEl = document.querySelector('#ambient-light');
            if (ambEl) {
              ambEl.setAttribute('color', ambColor);
              ambEl.setAttribute('intensity', ambIntensity);
            }
            let sunEl = document.querySelector('#sun-light');
            if (sunEl) {
              sunEl.setAttribute('color', sunColor);
              sunEl.setAttribute('intensity', sunIntensity);
            }
            let sceneEl = document.querySelector('#game-scene');
            if (sceneEl) {
              sceneEl.setAttribute('fog', `type: exponential; color: ${fogColor}; density: 0.065`);
              sceneEl.setAttribute('background', `color: ${bgColor}`);
            }

            // Trigger Checkpoint di detik ke 120
            if (window.gameTime >= window.nextCheckpoint) {
              window.nextCheckpoint += 120;
              this.triggerCheckpoint();
              return;
            }
          }

          if (!this.active || window.isGameOver || window.isCheckpoint) return;

          let rigPos = this.cameraRig.object3D.position;
          let distToPlayer = this.threatPos.distanceTo(rigPos);

          if (distToPlayer < 3.8) {
            this.triggerDeath();
            return;
          }

          // Dementor Mengejar
          let dir = new THREE.Vector3().subVectors(rigPos, this.threatPos).normalize();
          dir.y = 0; 
          
          let moveDist = this.speed * (timeDelta / 1000);
          this.threatPos.addScaledVector(dir, moveDist);
          this.el.object3D.position.copy(this.threatPos);
          
          this.el.object3D.lookAt(rigPos); 

          this.screechTimer -= timeDelta;
          if (this.screechTimer <= 0) {
            let vol = Math.max(0, 1.0 - (distToPlayer / 30));
            playScreech(vol);
            this.screechTimer = 1000 + (Math.random() * 1000);
          }
        }
      });

      // INISIALISASI UI
      document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        const startMenu = document.getElementById('start-menu');
        const restartBtn = document.getElementById('restart-btn');
        const cpResumeBtn = document.getElementById('resume-cp-btn');
        let bgmStarted = false;

        function initAudioAndStart() {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          
          if(!bgmStarted) {
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer; source.connect(audioCtx.destination);
            if (source.start) source.start(0); else source.noteOn(0);
            playBGM();
            bgmStarted = true;
          }
          
          setTimeout(() => {
            const threatEntity = document.querySelector('#threatEntity');
            if (threatEntity && threatEntity.components['threat-system']) {
              threatEntity.components['threat-system'].startGame();
            }
          }, 1000);
        }

        startBtn.addEventListener('click', () => {
          startMenu.style.display = 'none';
          initAudioAndStart();
        });

        cpResumeBtn.addEventListener('click', () => {
          const threatEntity = document.querySelector('#threatEntity');
          if (threatEntity) threatEntity.components['threat-system'].resumeFromCheckpoint();
        });

        restartBtn.addEventListener('click', () => {
          document.getElementById('death-overlay').style.display = 'none';
          window.gameTime = 0;
          window.nextCheckpoint = 120;
          
          const camRig = document.querySelector('#cameraRig');
          camRig.removeAttribute('animation');
          camRig.object3D.position.set(0, 0, 0);
          
          const threatEntity = document.querySelector('#threatEntity');
          if (threatEntity) threatEntity.components['threat-system'].speed = threatEntity.components['threat-system'].baseSpeed;

          initAudioAndStart();
        });
      });
    </script>
  </head>
  <body>
    
    <div id="fade-overlay"></div>

    <div id="start-menu">
      <div id="start-menu-box">
        <h1>SURVIVE THE LIMBO</h1>
        <p>Tap the floor to run. Move<br>AWAY from the screeching sound.</p>
        <button class="btn-glow" id="start-btn">ENTER SURVIVAL</button>
      </div>
    </div>

    <div id="hud-daynight-container">
      <span class="dn-icon">🌙</span>
      <div id="sun-moon-bar">
        <div id="sun-moon-fill"></div>
      </div>
      <span class="dn-icon">☀️</span>
      <span id="hud-timer-text">120s</span>
    </div>

    <div id="checkpoint-overlay">
      <h2>CHECKPOINT REACHED</h2>
      <video id="cp-video" src="gemini_generated_video_FA19BD58.mov" loop playsinline crossorigin="anonymous"></video>
      <p style="color:#aaa; font-family:monospace; margin-bottom: 20px;">Dawn is breaking... Prepare for the next round.</p>
      <button class="btn-glow" id="resume-cp-btn">RESUME RUNNING</button>
    </div>

    <div id="death-overlay">
      <h1 id="death-text">YOU DIED</h1>
      <p id="final-time">You survived for: <span id="final-time-val" style="color: #ff0000; font-weight: bold;">0.0</span>s</p>
      <button class="btn-glow" style="background: #110000;" id="restart-btn">PLAY AGAIN</button>
    </div>

    <a-scene id="game-scene" fog="type: exponential; color: #071313; density: 0.065" background="color: #071313">
      <a-assets>
        <a-asset-item id="dementor-model" src="dementor.glb"></a-asset-item>
      </a-assets>

      <a-entity id="cameraRig" position="0 0 0">
        <a-camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
          <a-entity cursor="rayOrigin: mouse;"
                    raycaster="objects: .walkable"
                    position="0 0 -1"
                    geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025"
                    material="color: #ffffff; shader: flat; opacity: 0.4">
          </a-entity>
        </a-camera>
      </a-entity>

      <a-entity id="threatEntity" visible="false" threat-system>
        <a-entity animation="property: position; to: 0 1.0 0; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine">
          
          <a-gltf-model src="#dementor-model" position="0 1.8 0" scale="4.5 4.5 4.5"></a-gltf-model>
          
          <a-light type="point" color="#ff0000" intensity="2.0" distance="10" position="0 3.0 0.5"></a-light>
          
        </a-entity>
      </a-entity>

      <a-light id="ambient-light" type="ambient" color="#1a2525" intensity="0.2"></a-light>
      <a-light id="sun-light" type="directional" color="#334466" intensity="0.3" position="0 15 0"></a-light>

      <a-plane class="walkable" tap-to-move endless-ground rotation="-90 0 0" width="200" height="200" color="#030808" material="shader: flat"></a-plane>
      <a-entity endless-forest="treeCount: 200; radius: 50"></a-entity>

    </a-scene>
  </body>
</html>
